const DATA = [{&#34;cve_id&#34;: &#34;CVE-2026-67614&#34;, &#34;sw_name&#34;: &#34;FastAPI&#34;, &#34;vendor&#34;: &#34;FastAPI&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;CRITICAL&#34;, &#34;cvss_score&#34;: 9.8, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H&#34;, &#34;published_date&#34;: &#34;20260813&#34;, &#34;modified_date&#34;: &#34;20260814&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] CyberPanel before 3.0.0 contains a hard-coded JWT secret vulnerability in the WebTerminal FastAPI SSH service that allows unauthenticated remote attackers to forge valid authentication tokens and obtain an interactive root shell via WebSocket on port 8888. Attackers can craft a forged JWT signed with the hardcoded secret value, specifying ssh_user=root, to authenticate to the terminal service without any valid credentials and receive a root shell.&#34;, &#34;reference_url&#34;: &#34;https://cyberpanel.net/KnowledgeBase/home/change-logs/&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260816211121&#34;, &#34;collected_at&#34;: &#34;20260816211125&#34;, &#34;content_hash&#34;: &#34;1559da3dc638fdeb54020c4b271e1814dc38c77ca85d7e061475aeeab33b03d0&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-31228&#34;, &#34;sw_name&#34;: &#34;Kubeflow&#34;, &#34;vendor&#34;: &#34;Kubeflow&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;CRITICAL&#34;, &#34;cvss_score&#34;: 9.8, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H&#34;, &#34;published_date&#34;: &#34;20260512&#34;, &#34;modified_date&#34;: &#34;20260812&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] The Adversarial Robustness Toolbox (ART) thru 1.20.1 contains a remote code execution vulnerability in its Kubeflow component. The robustness evaluation function for PyTorch models uses the unsafe eval() function to dynamically evaluate user-supplied strings for the LossFn and Optimizer parameters without any sanitization or security restrictions. An attacker can exploit this by providing a specially crafted string that contains arbitrary Python code, which will be executed when eval() is called, leading to complete compromise of the system running the ART evaluation.&#34;, &#34;reference_url&#34;: &#34;https://github.com/Trusted-AI/adversarial-robustness-toolbox&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;github&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260814211606&#34;, &#34;collected_at&#34;: &#34;20260814211613&#34;, &#34;content_hash&#34;: &#34;84a6c4863280692476d5c2c9dc02d3613ac7ad27821f6aadd9c793f28fb89ea7&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-31228&#34;, &#34;sw_name&#34;: &#34;PyTorch&#34;, &#34;vendor&#34;: &#34;PyTorch Foundation&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;CRITICAL&#34;, &#34;cvss_score&#34;: 9.8, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H&#34;, &#34;published_date&#34;: &#34;20260512&#34;, &#34;modified_date&#34;: &#34;20260812&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] The Adversarial Robustness Toolbox (ART) thru 1.20.1 contains a remote code execution vulnerability in its Kubeflow component. The robustness evaluation function for PyTorch models uses the unsafe eval() function to dynamically evaluate user-supplied strings for the LossFn and Optimizer parameters without any sanitization or security restrictions. An attacker can exploit this by providing a specially crafted string that contains arbitrary Python code, which will be executed when eval() is called, leading to complete compromise of the system running the ART evaluation.&#34;, &#34;reference_url&#34;: &#34;https://github.com/Trusted-AI/adversarial-robustness-toolbox&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260814211606&#34;, &#34;collected_at&#34;: &#34;20260814211613&#34;, &#34;content_hash&#34;: &#34;84a6c4863280692476d5c2c9dc02d3613ac7ad27821f6aadd9c793f28fb89ea7&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-73080&#34;, &#34;sw_name&#34;: &#34;gRPC&#34;, &#34;vendor&#34;: &#34;gRPC Authors&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;CRITICAL&#34;, &#34;cvss_score&#34;: 9.3, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:L/A:N&#34;, &#34;published_date&#34;: &#34;20260811&#34;, &#34;modified_date&#34;: &#34;20260813&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] SeaweedFS is a distributed storage system. Prior to 4.24, VolumeServer.FetchAndWriteNeedle in weed/server/volume_grpc_remote.go fetches a caller-supplied remote endpoint through weed/remote_storage/s3/s3_storage_client.go and writes the response into a needle. The RPC performs no authentication and no target validation, allowing anyone who can reach a volume server&#39;s gRPC port to cause requests to arbitrary hosts, including loopback, link-local, RFC 1918, and cloud metadata endpoints such as 169.254.169.254, and read the response. On cloud deployments, this can disclose instance metadata and IAM credentials and reach otherwise unexposed internal services. The volume server gRPC plane is unauthenticated by default, and configuring documented JWT signing keys does not protect this RPC. This issue is fixed in version 4.24.&#34;, &#34;reference_url&#34;: &#34;https://github.com/seaweedfs/seaweedfs/commit/69da20bdaec923e5a43d8aa71bf3c0a2051fc019&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260815211214&#34;, &#34;collected_at&#34;: &#34;20260815211219&#34;, &#34;content_hash&#34;: &#34;d41d22d6431a455fc13f5ad05d1120781fa6328073a401fb2adc31e6015c414c&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-33186&#34;, &#34;sw_name&#34;: &#34;gRPC&#34;, &#34;vendor&#34;: &#34;grpc&#34;, &#34;affected_range&#34;: &#34;&lt;1.79.3&#34;, &#34;fixed_version&#34;: &#34;1.79.3&#34;, &#34;severity&#34;: &#34;CRITICAL&#34;, &#34;cvss_score&#34;: 9.1, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N&#34;, &#34;published_date&#34;: &#34;20260320&#34;, &#34;modified_date&#34;: &#34;20260814&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;gRPC-Go is the Go language implementation of gRPC. Versions prior to 1.79.3 have an authorization bypass resulting from improper input validation of the HTTP/2 `:path` pseudo-header. The gRPC-Go server was too lenient in its routing logic, accepting requests where the `:path` omitted the mandatory leading slash (e.g., `Service/Method` instead of `/Service/Method`). While the server successfully routed these requests to the correct handler, authorization interceptors (including the official `grpc/authz` package) evaluated the raw, non-canonical path string. Consequently, \&#34;deny\&#34; rules defined using canonical paths (starting with `/`) failed to match the incoming request, allowing it to bypass the policy if a fallback \&#34;allow\&#34; rule was present. This affects gRPC-Go servers that use path-based authorization interceptors, such as the official RBAC implementation in `google.golang.org/grpc/authz` or custom interceptors relying on `info.FullMethod` or `grpc.Method(ctx)`; AND that have a securi&#34;, &#34;reference_url&#34;: &#34;https://github.com/grpc/grpc-go/security/advisories/GHSA-p77j-4mvh-x3m3&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260816211121&#34;, &#34;collected_at&#34;: &#34;20260816211125&#34;, &#34;content_hash&#34;: &#34;308df6b2d4bb752b7c0b1d8fa17d3a0a0993e5e9e26e5461632909c5612e7fe0&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-48746&#34;, &#34;sw_name&#34;: &#34;vLLM&#34;, &#34;vendor&#34;: &#34;vllm&#34;, &#34;affected_range&#34;: &#34;&gt;=0.3.0,&lt;0.22.0&#34;, &#34;fixed_version&#34;: &#34;0.22.0&#34;, &#34;severity&#34;: &#34;CRITICAL&#34;, &#34;cvss_score&#34;: 9.1, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:H&#34;, &#34;published_date&#34;: &#34;20260622&#34;, &#34;modified_date&#34;: &#34;20260814&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;vLLM is an inference and serving engine for large language models (LLMs). From 0.3.0 until 0.22.0, a vulnerability in ASGI web servers and starlette&#39;s trust on those web servers enables an authentication bypass of the OpenAI API AuthenticationMiddleware. It allows to use the API without providing the configured VLLM_API_KEY or --api-key. This vulnerability is fixed in 0.22.0.&#34;, &#34;reference_url&#34;: &#34;https://github.com/vllm-project/vllm/pull/43426&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260816211121&#34;, &#34;collected_at&#34;: &#34;20260816211125&#34;, &#34;content_hash&#34;: &#34;6cd5a44d47f6ada1285323fb69bb71973b1ebb97785c92fe8c1e6186c5a11794&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-73487&#34;, &#34;sw_name&#34;: &#34;Pandas&#34;, &#34;vendor&#34;: &#34;NumFOCUS&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;CRITICAL&#34;, &#34;cvss_score&#34;: 9.0, &#34;cvss_vector&#34;: &#34;CVSS:4.0/AV:N/AC:H/AT:N/PR:N/UI:N/VC:H/VI:L/VA:N/SC:H/SI:L/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X&#34;, &#34;published_date&#34;: &#34;20260813&#34;, &#34;modified_date&#34;: &#34;20260814&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] Flowise before 3.1.3 contains a regex-based Python code validator bypass in CSV and Airtable Agent nodes that allows unauthenticated attackers to inject malicious code via prompt injection. Attackers can exploit unblocked pandas functions like pd.read_json() to exfiltrate datasets, perform SSRF against internal services, or achieve code execution through the unauthenticated prediction API.&#34;, &#34;reference_url&#34;: &#34;https://github.com/FlowiseAI/Flowise/security/advisories/GHSA-w7x8-q2gp-5cgg&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260816211121&#34;, &#34;collected_at&#34;: &#34;20260816211125&#34;, &#34;content_hash&#34;: &#34;5839b52a78b00b8a45dd6106e5f11f16710b8f46385a40caa10a3f0bd7e05c17&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-58076&#34;, &#34;sw_name&#34;: &#34;Airflow&#34;, &#34;vendor&#34;: &#34;apache&#34;, &#34;affected_range&#34;: &#34;&gt;=3.3.0,&lt;3.3.1&#34;, &#34;fixed_version&#34;: &#34;3.3.1&#34;, &#34;severity&#34;: &#34;HIGH&#34;, &#34;cvss_score&#34;: 8.8, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H&#34;, &#34;published_date&#34;: &#34;20260812&#34;, &#34;modified_date&#34;: &#34;20260814&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;Apache Airflow&#39;s serialization layer reconstructed exception nodes by calling `import_string()` on a class name taken from the serialized blob and instantiating it with arguments from the same blob, with no restriction on what could be imported. An operator&#39;s `executor_config` reaches that branch, so a Dag author could place a value there that causes an arbitrary callable to be imported and invoked -- for example `subprocess.check_output`, or `builtins.eval` on the `builtins`-prefixed variant. The code runs in the **Scheduler**, which reconstructs serialized Dags in its normal loop with no request involved, and in the **API server**, on any authenticated read of the Dag such as `GET /api/v2/dags/{dag_id}/details`. Both are components the Airflow security model states must never execute Dag-author code, and both hold the metadata database credentials and the JWT signing secret. No non-default configuration is required. This is a **different sink from CVE-2026-33264**, which covered only&#34;, &#34;reference_url&#34;: &#34;https://github.com/apache/airflow/pull/68511&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260816211121&#34;, &#34;collected_at&#34;: &#34;20260816211125&#34;, &#34;content_hash&#34;: &#34;53ac96543cf94c3ef80e7e45911e54f9f5faa3c6f12273cbdda2a827e899ad5a&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-67587&#34;, &#34;sw_name&#34;: &#34;Airflow&#34;, &#34;vendor&#34;: &#34;Apache Software Foundation&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;HIGH&#34;, &#34;cvss_score&#34;: 8.8, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H&#34;, &#34;published_date&#34;: &#34;20260812&#34;, &#34;modified_date&#34;: &#34;20260813&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] Apache Airflow&#39;s Task SDK rebuilt a `Callback` object from serialized data by re-running its constructor, which imports the module named by the stored callback path. Because `SyncCallback` is itself an Airflow class it passes the default `allowed_deserialization_classes` allow-list, so tightening that setting does not help. A Dag author — who controls a task instance&#39;s `next_kwargs` through the task execution API — can therefore cause an arbitrary module to be imported inside the scheduler process, when the scheduler&#39;s `awaiting_input` timeout sweep deserializes that value. No non-default configuration is required; the sweep runs unconditionally. Versions before 3.3.0 are not affected: the class existed, but the scheduler sweep that reaches it did not. This is a separate code path from CVE-2026-58076 and CVE-2026-67260, which cover different gadgets reaching deserialization — applying either of those fixes does not address this one. Users are advised to upgrade to apache-air&#34;, &#34;reference_url&#34;: &#34;https://github.com/apache/airflow/pull/70704&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260815211214&#34;, &#34;collected_at&#34;: &#34;20260815211219&#34;, &#34;content_hash&#34;: &#34;dd163de989d999af2e6fb8e964d67b7ec73c0f082d95fcb09dd5d33256c89921&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-72642&#34;, &#34;sw_name&#34;: &#34;Elasticsearch&#34;, &#34;vendor&#34;: &#34;Elastic&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;HIGH&#34;, &#34;cvss_score&#34;: 8.8, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H&#34;, &#34;published_date&#34;: &#34;20260813&#34;, &#34;modified_date&#34;: &#34;20260814&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] The native inference process that Elasticsearch uses to evaluate uploaded machine learning models accepts a model operation that computes a memory address from an offset supplied inside the model, without validating that the offset stays within the bounds of the underlying storage. A user with the privileges required to upload and deploy a trained model can craft a model that reads and writes memory outside the intended allocation. The result is heap corruption that crashes the inference process, and, with sufficient control over the heap layout, could allow arbitrary code execution in the context of that process.&#34;, &#34;reference_url&#34;: &#34;https://discuss.elastic.co/t/elasticsearch-8-19-20-9-4-5-9-5-1-security-update-esa-2026-123/389504&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260816211121&#34;, &#34;collected_at&#34;: &#34;20260816211125&#34;, &#34;content_hash&#34;: &#34;4ff0756bb0b870908d94648621b5939633c3b06c487cf6ac17f392a45ddf2d83&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-57516&#34;, &#34;sw_name&#34;: &#34;Ray&#34;, &#34;vendor&#34;: &#34;Anyscale&#34;, &#34;affected_range&#34;: &#34;&lt;2.56.0&#34;, &#34;fixed_version&#34;: &#34;2.56.0&#34;, &#34;severity&#34;: &#34;HIGH&#34;, &#34;cvss_score&#34;: 8.8, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H&#34;, &#34;published_date&#34;: &#34;20260724&#34;, &#34;modified_date&#34;: &#34;20260814&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;## Summary `ray.data.read_webdataset(paths=...)` is a `@PublicAPI(stability=\&#34;alpha\&#34;)` reader for WebDataset-format TAR files. Its default `decoder=True` invokes `_default_decoder` on every sample&#39;s keys, which routes file extension to a decoder by extension. Two of those branches deserialize attacker-controlled bytes with no validation: - `.pickle` / `.pkl` -&gt; `pickle.loads(value)` - `.pt` / `.pth` -&gt; `torch.load(io.BytesIO(value), weights_only=False)` Both fire during a standard `ray.data.read_webdataset(...).take_all()` / `.iter_batches()` call. No flags, no opt-in, no environment variable. An attacker who can supply a TAR (via S3 share, HuggingFace Hub mirror, email attachment, model-zoo, or any HTTP URL the user passes to `read_webdataset`) achieves arbitrary code execution in the calling Ray process at schema-sample time, before row data is consumed. This is the same class of bug as GHSA-mw35-8rx3-xf9r (Parquet Arrow Extension Type cloudpickle deserialization, patched in 2.55.0): &#34;, &#34;reference_url&#34;: &#34;https://nvd.nist.gov/vuln/detail/CVE-2026-57516&#34;, &#34;source&#34;: &#34;OSV&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814053105&#34;, &#34;last_seen_run&#34;: &#34;20260816211121&#34;, &#34;collected_at&#34;: &#34;20260816211121&#34;, &#34;content_hash&#34;: &#34;7df643b2399a04316ddaef40ab0d90b17b6ebbf2a2ef7d0daf57f55e3d417ee7&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-73417&#34;, &#34;sw_name&#34;: &#34;Jupyter Notebook&#34;, &#34;vendor&#34;: &#34;Project Jupyter&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;HIGH&#34;, &#34;cvss_score&#34;: 8.6, &#34;cvss_vector&#34;: &#34;CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:A/VC:H/VI:H/VA:L/SC:N/SI:N/SA:L/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X&#34;, &#34;published_date&#34;: &#34;20260813&#34;, &#34;modified_date&#34;: &#34;20260814&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] jupyterlab is an extensible environment for interactive and reproducible computing, based on the Jupyter Notebook Architecture. From 3.3.0 until 4.5.10 and 4.6.2, JupyterLab allows notebook settings to be shared and applied through an overrides.json file using the Import button in the Settings Editor. In packages/notebook-extension/schema/tracker.json and packages/notebook-extension/src/index.ts, the sideBySideLeftMarginOverride and sideBySideRightMarginOverride settings are not properly validated before being inserted into style content, allowing a crafted settings file to contain instructions that execute as code instead of only changing display preferences. A user can import the malicious file, or an attacker with access to a shared settings location can plant an overrides.json that is applied automatically. The embedded code runs with the affected user&#39;s access and can read or modify notebooks and files and run code through the notebook server, including on a connected k&#34;, &#34;reference_url&#34;: &#34;https://github.com/jupyterlab/jupyterlab/commit/9365f020baec5221deaf11535ed554c06637c999&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260816211121&#34;, &#34;collected_at&#34;: &#34;20260816211125&#34;, &#34;content_hash&#34;: &#34;aa9abe28657ffeeacfbfbe4ee19ea98213f4ce6f3f8145982a4230787844f8fc&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-73417&#34;, &#34;sw_name&#34;: &#34;JupyterLab&#34;, &#34;vendor&#34;: &#34;Project Jupyter&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;HIGH&#34;, &#34;cvss_score&#34;: 8.6, &#34;cvss_vector&#34;: &#34;CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:A/VC:H/VI:H/VA:L/SC:N/SI:N/SA:L/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X&#34;, &#34;published_date&#34;: &#34;20260813&#34;, &#34;modified_date&#34;: &#34;20260814&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] jupyterlab is an extensible environment for interactive and reproducible computing, based on the Jupyter Notebook Architecture. From 3.3.0 until 4.5.10 and 4.6.2, JupyterLab allows notebook settings to be shared and applied through an overrides.json file using the Import button in the Settings Editor. In packages/notebook-extension/schema/tracker.json and packages/notebook-extension/src/index.ts, the sideBySideLeftMarginOverride and sideBySideRightMarginOverride settings are not properly validated before being inserted into style content, allowing a crafted settings file to contain instructions that execute as code instead of only changing display preferences. A user can import the malicious file, or an attacker with access to a shared settings location can plant an overrides.json that is applied automatically. The embedded code runs with the affected user&#39;s access and can read or modify notebooks and files and run code through the notebook server, including on a connected k&#34;, &#34;reference_url&#34;: &#34;https://github.com/jupyterlab/jupyterlab/commit/9365f020baec5221deaf11535ed554c06637c999&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260816211121&#34;, &#34;collected_at&#34;: &#34;20260816211125&#34;, &#34;content_hash&#34;: &#34;aa9abe28657ffeeacfbfbe4ee19ea98213f4ce6f3f8145982a4230787844f8fc&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-73484&#34;, &#34;sw_name&#34;: &#34;Pandas&#34;, &#34;vendor&#34;: &#34;NumFOCUS&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;HIGH&#34;, &#34;cvss_score&#34;: 8.6, &#34;cvss_vector&#34;: &#34;CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X&#34;, &#34;published_date&#34;: &#34;20260813&#34;, &#34;modified_date&#34;: &#34;20260813&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] Flowise before 3.1.3 contains a sandbox escape vulnerability in pythonCodeValidator.ts that fails to block native Pandas DataFrame methods like to_csv, to_json, pipe, and query. Authenticated attackers can exploit this to exfiltrate uploaded CSV data or write arbitrary files to the server filesystem.&#34;, &#34;reference_url&#34;: &#34;https://github.com/FlowiseAI/Flowise/security/advisories/GHSA-x58f-9m57-qc4m&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260815211214&#34;, &#34;collected_at&#34;: &#34;20260815211219&#34;, &#34;content_hash&#34;: &#34;ea0995383d53dabb15e307e16c2ceb2ab357e52fcb0543eb6f475b821e499313&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-72766&#34;, &#34;sw_name&#34;: &#34;n8n&#34;, &#34;vendor&#34;: &#34;n8n GmbH&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;HIGH&#34;, &#34;cvss_score&#34;: 8.2, &#34;cvss_vector&#34;: &#34;CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:N/VA:N/SC:L/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X&#34;, &#34;published_date&#34;: &#34;20260811&#34;, &#34;modified_date&#34;: &#34;20260814&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] n8n before 1.123.67, 2.x before 2.31.5, and 2.32.x before 2.32.1 contain a type confusion vulnerability in the Send Email node, which does not enforce that its message fields are strings. A crafted non-string value supplied from a workflow expression into the text or HTML body field can be interpreted by the underlying mail library (Nodemailer) as a file path or URL, allowing arbitrary local file disclosure and server-side request forgery (SSRF). Exploitation requires a pre-existing active workflow with an unauthenticated webhook, valid SMTP credentials configured on the node, and untrusted input mapped directly into the body field; this is not a default configuration.&#34;, &#34;reference_url&#34;: &#34;https://github.com/n8n-io/n8n/security/advisories/GHSA-2x35-3fw4-9jr4&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;npm&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260816211121&#34;, &#34;collected_at&#34;: &#34;20260816211125&#34;, &#34;content_hash&#34;: &#34;4396af3930cd8bf6895b5abd70ce24bbe8d0b400e9eb5c56088c86a72188fa95&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-19111&#34;, &#34;sw_name&#34;: &#34;Elasticsearch&#34;, &#34;vendor&#34;: &#34;Elastic&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;HIGH&#34;, &#34;cvss_score&#34;: 8.1, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N&#34;, &#34;published_date&#34;: &#34;20260806&#34;, &#34;modified_date&#34;: &#34;20260812&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] Insecure direct object reference in the mongodb_memory, elasticsearch_memory, and mem0_memory tools in Amazon Strands Agents Tools before 0.8.3 might allow remote authenticated users to access, modify, or delete memories belonging to other tenants by influencing the LLM to emit tool calls with a forged namespace parameter. To remediate this issue, users should upgrade to version 0.8.3.&#34;, &#34;reference_url&#34;: &#34;https://aws.amazon.com/security/security-bulletins/2026-077-aws/&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260814211606&#34;, &#34;collected_at&#34;: &#34;20260814211613&#34;, &#34;content_hash&#34;: &#34;ce71e523a94701644f5218eb7b450f798dbdd6e6c521eaabfdc26a88b613246c&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-8147&#34;, &#34;sw_name&#34;: &#34;MLflow&#34;, &#34;vendor&#34;: &#34;Databricks&#34;, &#34;affected_range&#34;: &#34;&gt;=2.14.0rc0,&lt;3.13.0rc0&#34;, &#34;fixed_version&#34;: &#34;3.13.0rc0&#34;, &#34;severity&#34;: &#34;HIGH&#34;, &#34;cvss_score&#34;: 8.1, &#34;cvss_vector&#34;: &#34;CVSS:3.0/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N&#34;, &#34;published_date&#34;: &#34;20260702&#34;, &#34;modified_date&#34;: &#34;20260813&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;MLflow: trace API endpoints lack proper authorization validators In MLflow versions prior to 3.13.0, when running with authentication enabled, the trace API endpoints lack proper authorization validators. This allows any authenticated user to bypass experiment-level authorization controls on all trace operations, including reading, deleting, and modifying traces on experiments they do not have permission to access. The issue arises from the `_before_request` handler, which does not register authorization validators for trace endpoints, resulting in requests proceeding without validation. This vulnerability can expose sensitive data, destroy audit logs, and allow unauthorized modifications.&#34;, &#34;reference_url&#34;: &#34;https://github.com/advisories/GHSA-2cm6-r77w-6g96&#34;, &#34;source&#34;: &#34;OSV+GHSA&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260815211214&#34;, &#34;collected_at&#34;: &#34;20260815211306&#34;, &#34;content_hash&#34;: &#34;04a5c03607e1d091e54d824ff66967e384b9e617d6c6a43a4f0586f0749ef83e&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-19594&#34;, &#34;sw_name&#34;: &#34;Streamlit&#34;, &#34;vendor&#34;: &#34;Snowflake&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;HIGH&#34;, &#34;cvss_score&#34;: 8.1, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:H&#34;, &#34;published_date&#34;: &#34;20260812&#34;, &#34;modified_date&#34;: &#34;20260812&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] Insufficient input sanitization in Snowflake Python API (`snowflake.core`) versions prior to 1.13.0 allowed confused-deputy privilege escalation through two related weaknesses: path traversal (CWE-22) via unencoded `..` identifier path segments, and HTTP parameter pollution (CWE-141) via unencoded `&amp;`/`#`/`=` characters in query string values. An attacker with access to a downstream application built on snowflake.core could exploit the path traversal by supplying `..` as an object name, causing `snowflake.core` to issue REST requests against a parent resource or exploit the parameter pollution by injecting `&amp;`/`#`/`=` into a free-form name field to override constraints on swap, clone, or rename operations — all executed under the application&#39;s privileged session. Successful exploitation requires the attacker to control an identifier or object-name string in an application built on snowflake.core that passes it to `snowflake.core` under a higher-privileged Snowflake session (&#34;, &#34;reference_url&#34;: &#34;https://pypi.org/project/snowflake.core/1.13.0/&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260814211606&#34;, &#34;collected_at&#34;: &#34;20260814211613&#34;, &#34;content_hash&#34;: &#34;4c9ca6ddb5df49a8329083cf1439c9c8c15df3f6eeeae4bbb5d874739721c779&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-72672&#34;, &#34;sw_name&#34;: &#34;Elasticsearch&#34;, &#34;vendor&#34;: &#34;Elastic&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;HIGH&#34;, &#34;cvss_score&#34;: 7.7, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:N/A:N&#34;, &#34;published_date&#34;: &#34;20260813&#34;, &#34;modified_date&#34;: &#34;20260813&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] The Elastic Security capability that suggests existing field values while a user authors endpoint policy artifacts queries Elastic Defend event data with Kibana&#39;s internal Elasticsearch account instead of the account of the requesting user. Only Kibana feature privileges are verified, and the caller&#39;s Elasticsearch index privileges are not. An authenticated user who holds Elastic Security feature privileges but no read access to the Elastic Defend event indices can therefore retrieve field values from that data, including process command line arguments, which commonly contain tokens, credentials, connection strings, and other sensitive operational detail from protected hosts.&#34;, &#34;reference_url&#34;: &#34;https://discuss.elastic.co/t/kibana-9-4-5-security-update-esa-2026-89/389536&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260815211214&#34;, &#34;collected_at&#34;: &#34;20260815211219&#34;, &#34;content_hash&#34;: &#34;8348f5a6b75377e66f52d0f27d0642b51bdde0cdcf910307e6478ed51b997857&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-4035&#34;, &#34;sw_name&#34;: &#34;MLflow&#34;, &#34;vendor&#34;: &#34;lfprojects&#34;, &#34;affected_range&#34;: &#34;&lt;3.11.0&#34;, &#34;fixed_version&#34;: &#34;3.11.0&#34;, &#34;severity&#34;: &#34;HIGH&#34;, &#34;cvss_score&#34;: 7.7, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:N/A:N&#34;, &#34;published_date&#34;: &#34;20260603&#34;, &#34;modified_date&#34;: &#34;20260814&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;A vulnerability in mlflow/mlflow versions prior to 3.11.0 allows for the resolution of environment variables in AI Gateway secrets, which can be exploited to exfiltrate sensitive server-side environment credentials to an attacker-controlled endpoint. This issue arises because the `api_key` field in gateway secrets can accept `$ENV_VAR` references, which are resolved against the MLflow server&#39;s environment during runtime. The resolved secrets are then sent in provider authentication headers to the configured upstream `api_base`. This vulnerability can be exploited by low-privileged authenticated users in basic-auth deployments or by unauthenticated users in default deployments without `basic-auth`. The impact includes potential leakage of sensitive credentials such as cloud artifact credentials (`AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`), which could lead to artifact poisoning and cross-boundary code execution in downstream environments. The issue is fixed in version 3.11.0.&#34;, &#34;reference_url&#34;: &#34;https://github.com/mlflow/mlflow/commit/4a3f2f720cb4f058c9e0c5b883e0acc9ab64a7f3&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260816211121&#34;, &#34;collected_at&#34;: &#34;20260816211125&#34;, &#34;content_hash&#34;: &#34;e8952f5bf7b128d7a3eb33a0cf734b78320b8fdba228f4d52890b2972a4f5b49&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-68968&#34;, &#34;sw_name&#34;: &#34;Airflow&#34;, &#34;vendor&#34;: &#34;apache&#34;, &#34;affected_range&#34;: &#34;&lt;3.3.1&#34;, &#34;fixed_version&#34;: &#34;3.3.1&#34;, &#34;severity&#34;: &#34;HIGH&#34;, &#34;cvss_score&#34;: 7.5, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N&#34;, &#34;published_date&#34;: &#34;20260812&#34;, &#34;modified_date&#34;: &#34;20260813&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;Apache Airflow&#39;s Backfill API authorized a request against a Dag id supplied by the caller whenever the `backfill_id` path segment failed to parse. The authorization dependency parsed it with `int()` while the route handler parsed it as pydantic&#39;s `NonNegativeInt`, which accepts values `int()` rejects (`1.0` coerces to `1`); FastAPI resolves dependencies before endpoint validation, so the two acted on different Dags. An authenticated user holding edit permission on any single Dag could therefore read, pause and cancel backfills belonging to any other Dag, including moving another Dag&#39;s queued runs to `failed`. No non-default configuration is required and backfill ids are sequential, so finding a target is trivial. Users are advised to upgrade to apache-airflow 3.3.1 or later, which parses the backfill id with the same type the routes declare.&#34;, &#34;reference_url&#34;: &#34;https://github.com/apache/airflow/pull/70889&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260815211214&#34;, &#34;collected_at&#34;: &#34;20260815211219&#34;, &#34;content_hash&#34;: &#34;f52aae4bf87fd60d62216f32e3b04eecbbe638e01923424ec7026493a5c9afc3&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-45804&#34;, &#34;sw_name&#34;: &#34;Diffusers&#34;, &#34;vendor&#34;: &#34;huggingface&#34;, &#34;affected_range&#34;: &#34;&lt;0.38.0&#34;, &#34;fixed_version&#34;: &#34;0.38.0&#34;, &#34;severity&#34;: &#34;HIGH&#34;, &#34;cvss_score&#34;: 7.5, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:H/PR:N/UI:R/S:U/C:H/I:H/A:H&#34;, &#34;published_date&#34;: &#34;20260715&#34;, &#34;modified_date&#34;: &#34;20260812&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;Diffusers is the a library for pretrained diffusion models. Prior to 0.38.0, Diffusers&#39; DiffusionPipeline.from_pretrained flow can bypass the trust_remote_code guard because download() validates model_index.json and custom pipeline code before later loading from a cached folder that can change, allowing a Hub repository with custom .py pipeline code to execute through the custom pipeline flow without passing custom_pipeline or trust_remote_code=True. This issue is fixed in version 0.38.0.&#34;, &#34;reference_url&#34;: &#34;https://github.com/huggingface/diffusers/commit/a37f6f8394ac2a7ee8360c3abea811efe54512b1&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260814211606&#34;, &#34;collected_at&#34;: &#34;20260814211613&#34;, &#34;content_hash&#34;: &#34;372941f3167fdff749191cba7e8d479b35aad8a75516b7b4ca62df59c3d3d139&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-68968&#34;, &#34;sw_name&#34;: &#34;FastAPI&#34;, &#34;vendor&#34;: &#34;FastAPI&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;HIGH&#34;, &#34;cvss_score&#34;: 7.5, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N&#34;, &#34;published_date&#34;: &#34;20260812&#34;, &#34;modified_date&#34;: &#34;20260813&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] Apache Airflow&#39;s Backfill API authorized a request against a Dag id supplied by the caller whenever the `backfill_id` path segment failed to parse. The authorization dependency parsed it with `int()` while the route handler parsed it as pydantic&#39;s `NonNegativeInt`, which accepts values `int()` rejects (`1.0` coerces to `1`); FastAPI resolves dependencies before endpoint validation, so the two acted on different Dags. An authenticated user holding edit permission on any single Dag could therefore read, pause and cancel backfills belonging to any other Dag, including moving another Dag&#39;s queued runs to `failed`. No non-default configuration is required and backfill ids are sequential, so finding a target is trivial. Users are advised to upgrade to apache-airflow 3.3.1 or later, which parses the backfill id with the same type the routes declare.&#34;, &#34;reference_url&#34;: &#34;https://github.com/apache/airflow/pull/70889&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260815211214&#34;, &#34;collected_at&#34;: &#34;20260815211219&#34;, &#34;content_hash&#34;: &#34;fd81726e996af1a5b1d8f307a9e1d0478952599f5eef3f874a28d48d900b1fb8&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-73415&#34;, &#34;sw_name&#34;: &#34;Jupyter Notebook&#34;, &#34;vendor&#34;: &#34;Project Jupyter&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;HIGH&#34;, &#34;cvss_score&#34;: 7.5, &#34;cvss_vector&#34;: &#34;CVSS:4.0/AV:N/AC:H/AT:N/PR:N/UI:A/VC:H/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X&#34;, &#34;published_date&#34;: &#34;20260812&#34;, &#34;modified_date&#34;: &#34;20260812&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] jupyterlab is an extensible environment for interactive and reproducible computing, based on the Jupyter Notebook Architecture. Prior to 4.5.10 and 4.6.2, in packages/imageviewer/src/widget.ts, JupyterLab&#39;s ImageViewer uses URL.createObjectURL for a specially crafted SVG image and revokes the blob URL too early, allowing the image to retain an executable same-origin context when it is opened through the image viewer and then opened in a new browser tab. The resulting cross-site scripting can be used to execute arbitrary code on the JupyterLab server. This issue is fixed in versions 4.5.10 and 4.6.2.&#34;, &#34;reference_url&#34;: &#34;https://github.com/jupyterlab/jupyterlab/commit/9365f020baec5221deaf11535ed554c06637c999&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260814211606&#34;, &#34;collected_at&#34;: &#34;20260814211613&#34;, &#34;content_hash&#34;: &#34;c248f96ed1ab62af803c22265d7393a08941fcbbee052a95260e29243ce82b38&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-25990&#34;, &#34;sw_name&#34;: &#34;Pillow&#34;, &#34;vendor&#34;: &#34;python&#34;, &#34;affected_range&#34;: &#34;&gt;=10.3.0,&lt;12.1.1&#34;, &#34;fixed_version&#34;: &#34;12.1.1&#34;, &#34;severity&#34;: &#34;HIGH&#34;, &#34;cvss_score&#34;: 7.5, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H&#34;, &#34;published_date&#34;: &#34;20260211&#34;, &#34;modified_date&#34;: &#34;20260812&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;Pillow is a Python imaging library. From 10.3.0 to before 12.1.1, an out-of-bounds write may be triggered when loading a specially crafted PSD image. This vulnerability is fixed in 12.1.1.&#34;, &#34;reference_url&#34;: &#34;https://github.com/python-pillow/Pillow/commit/9000313cc5d4a31bdcdd6d7f0781101abab553aa&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260814211606&#34;, &#34;collected_at&#34;: &#34;20260814211613&#34;, &#34;content_hash&#34;: &#34;3c261b76d8354c57bd932557458fd810d13c9bebe0683b1055a8ceca554c146e&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-40192&#34;, &#34;sw_name&#34;: &#34;Pillow&#34;, &#34;vendor&#34;: &#34;python&#34;, &#34;affected_range&#34;: &#34;&gt;=10.3.0,&lt;12.2.0&#34;, &#34;fixed_version&#34;: &#34;12.2.0&#34;, &#34;severity&#34;: &#34;HIGH&#34;, &#34;cvss_score&#34;: 7.5, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H&#34;, &#34;published_date&#34;: &#34;20260415&#34;, &#34;modified_date&#34;: &#34;20260812&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;Pillow is a Python imaging library. Versions 10.3.0 through 12.1.1 did not limit the amount of GZIP-compressed data read when decoding a FITS image, making them vulnerable to decompression bomb attacks. A specially crafted FITS file could cause unbounded memory consumption, leading to denial of service (OOM crash or severe performance degradation). If users are unable to immediately upgrade, they should only open specific image formats, excluding FITS, as a workaround.&#34;, &#34;reference_url&#34;: &#34;https://github.com/python-pillow/Pillow/commit/3cb854e8b2bab43f40e342e665f9340d861aa628&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260814211606&#34;, &#34;collected_at&#34;: &#34;20260814211613&#34;, &#34;content_hash&#34;: &#34;20a12436fa54c47ea1ee8abac3f44310596888c4496965fc0af813a644548754&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-18618&#34;, &#34;sw_name&#34;: &#34;gRPC&#34;, &#34;vendor&#34;: &#34;gRPC Authors&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;HIGH&#34;, &#34;cvss_score&#34;: 7.5, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H&#34;, &#34;published_date&#34;: &#34;20260810&#34;, &#34;modified_date&#34;: &#34;20260814&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] A flaw was found in ml-metadata. The statically-linked gRPC stack in ml-metadata is outdated, making it vulnerable to known HTTP/2 denial of service (DoS) issues. An in-cluster attacker, with network access to the MLMD pod, could exploit these vulnerabilities by sending specially crafted HTTP/2 requests. This could lead to a denial of service by crashing the MLMD pod, disrupting all pipeline runs in the affected namespace.&#34;, &#34;reference_url&#34;: &#34;https://access.redhat.com/errata/RHSA-2026:53261&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260816211121&#34;, &#34;collected_at&#34;: &#34;20260816211125&#34;, &#34;content_hash&#34;: &#34;d8b3d2afb80f546086ec2eca4fbd21cc8454d9de3bf979c80bc952918f9bea06&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-40983&#34;, &#34;sw_name&#34;: &#34;gRPC&#34;, &#34;vendor&#34;: &#34;gRPC Authors&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;HIGH&#34;, &#34;cvss_score&#34;: 7.5, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H&#34;, &#34;published_date&#34;: &#34;20260609&#34;, &#34;modified_date&#34;: &#34;20260813&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] In Micrometer, it is possible for a user to provide specially crafted gRPC requests that may cause a denial-of-service (DoS) condition. Affected versions: Micrometer 1.16.0 through 1.16.5; 1.15.0 through 1.15.11.&#34;, &#34;reference_url&#34;: &#34;https://spring.io/security/cve-2026-40983&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260815211214&#34;, &#34;collected_at&#34;: &#34;20260815211219&#34;, &#34;content_hash&#34;: &#34;35fbd7f27e09f30ac4cecf66d0e6e6b9d64ea31b8db01093b0ef03fbb62fd371&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-45799&#34;, &#34;sw_name&#34;: &#34;gRPC&#34;, &#34;vendor&#34;: &#34;gRPC Authors&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;HIGH&#34;, &#34;cvss_score&#34;: 7.5, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H&#34;, &#34;published_date&#34;: &#34;20260717&#34;, &#34;modified_date&#34;: &#34;20260812&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] Wire provides gRPC and protocol buffers for Android, Kotlin, Swift, and Java. Prior to 6.3.0 and 7.0.0-alpha03, ByteArrayProtoReader32.skipGroup() and ProtoReader.skipGroup() in wire-runtime do not validate that a LENGTH_DELIMITED field length is non-negative before skip(), allowing a crafted protobuf varint encoding -128 as a signed Int to make skip(-128) move the internal position negative and make the next readByte() throw ArrayIndexOutOfBoundsException instead of the documented IOException or ProtocolException, which can crash services using ProtoAdapter.decode(byte[]) on untrusted payloads. This issue is fixed in versions 6.3.0 and 7.0.0-alpha03.&#34;, &#34;reference_url&#34;: &#34;https://github.com/square/wire/commit/47d5b0dba53935d5332cd41a80a353b3fc90e7b0&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260814211606&#34;, &#34;collected_at&#34;: &#34;20260814211613&#34;, &#34;content_hash&#34;: &#34;4ae99d65b48a9f16bea102f8e82263d2835f70a21d5d747ad977e26a21260337&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-44289&#34;, &#34;sw_name&#34;: &#34;protobuf&#34;, &#34;vendor&#34;: &#34;Google&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;HIGH&#34;, &#34;cvss_score&#34;: 7.5, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H&#34;, &#34;published_date&#34;: &#34;20260513&#34;, &#34;modified_date&#34;: &#34;20260812&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] protobufjs compiles protobuf definitions into JavaScript (JS) functions. Prior to 7.5.6 and 8.0.2, protobufjs could recurse without a depth limit while decoding nested protobuf data. This affected both skipping unknown group fields and generated decoding of nested message fields. A crafted protobuf binary payload could cause the JavaScript call stack to be exhausted during decoding. This vulnerability is fixed in 7.5.6 and 8.0.2.&#34;, &#34;reference_url&#34;: &#34;https://github.com/protobufjs/protobuf.js/security/advisories/GHSA-685m-2w69-288q&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260814211606&#34;, &#34;collected_at&#34;: &#34;20260814211613&#34;, &#34;content_hash&#34;: &#34;b4319ea5664393163f52100ee3e64ff693eae6a532fa854ba0da2dc09304278c&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-45799&#34;, &#34;sw_name&#34;: &#34;protobuf&#34;, &#34;vendor&#34;: &#34;Google&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;HIGH&#34;, &#34;cvss_score&#34;: 7.5, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H&#34;, &#34;published_date&#34;: &#34;20260717&#34;, &#34;modified_date&#34;: &#34;20260812&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] Wire provides gRPC and protocol buffers for Android, Kotlin, Swift, and Java. Prior to 6.3.0 and 7.0.0-alpha03, ByteArrayProtoReader32.skipGroup() and ProtoReader.skipGroup() in wire-runtime do not validate that a LENGTH_DELIMITED field length is non-negative before skip(), allowing a crafted protobuf varint encoding -128 as a signed Int to make skip(-128) move the internal position negative and make the next readByte() throw ArrayIndexOutOfBoundsException instead of the documented IOException or ProtocolException, which can crash services using ProtoAdapter.decode(byte[]) on untrusted payloads. This issue is fixed in versions 6.3.0 and 7.0.0-alpha03.&#34;, &#34;reference_url&#34;: &#34;https://github.com/square/wire/commit/47d5b0dba53935d5332cd41a80a353b3fc90e7b0&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260814211606&#34;, &#34;collected_at&#34;: &#34;20260814211613&#34;, &#34;content_hash&#34;: &#34;4ae99d65b48a9f16bea102f8e82263d2835f70a21d5d747ad977e26a21260337&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-67260&#34;, &#34;sw_name&#34;: &#34;Airflow&#34;, &#34;vendor&#34;: &#34;Apache Software Foundation&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;HIGH&#34;, &#34;cvss_score&#34;: 7.3, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:L&#34;, &#34;published_date&#34;: &#34;20260812&#34;, &#34;modified_date&#34;: &#34;20260812&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] Apache Airflow 3.3.0 moved human-in-the-loop tasks from the triggerer to a new `awaiting_input` task state swept by the scheduler. That sweep deserializes the task instance&#39;s `next_kwargs` without an allow-list, so a Dag author — who controls that value through the task execution API — can cause an arbitrary module import and object instantiation inside the scheduler process, or terminate the scheduler job. No non-default configuration is required: the sweep runs unconditionally every 15 seconds, and the default `allowed_deserialization_classes` setting does not cover this code path. Versions before 3.3.0 are not affected, because human-in-the-loop tasks deferred onto the triggerer instead. This is a different code path from CVE-2026-58076, which covers the same unguarded exception-node deserialization reached elsewhere — deployments that applied that fix must upgrade for this issue as well. Users are advised to upgrade to apache-airflow 3.3.1 or later.&#34;, &#34;reference_url&#34;: &#34;https://github.com/apache/airflow/pull/70685&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260814211606&#34;, &#34;collected_at&#34;: &#34;20260814211613&#34;, &#34;content_hash&#34;: &#34;cc998d841d8621ef8507d872d5fc0b8bd1f34677411ac3d58257a30e5f801fdd&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-72632&#34;, &#34;sw_name&#34;: &#34;Elasticsearch&#34;, &#34;vendor&#34;: &#34;Elastic&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;HIGH&#34;, &#34;cvss_score&#34;: 7.1, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:L/A:N&#34;, &#34;published_date&#34;: &#34;20260813&#34;, &#34;modified_date&#34;: &#34;20260813&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] Observable Discrepancy (CWE-203) in Kibana Fleet can lead to information disclosure via Excavation (CAPEC-116). Fleet removes the Elasticsearch API key value of an enrolled Elastic Agent from the responses of its agent listing capability, but that capability accepted caller-supplied filter expressions over the stored field that holds the value, and evaluated them with Kibana&#39;s own internal Elasticsearch privileges rather than the caller&#39;s. Because the number of matching agents is reported back to the caller, the difference between a matching and a non-matching filter formed a side channel from which the full API key value could be reconstructed one character at a time with a short sequence of requests.&#34;, &#34;reference_url&#34;: &#34;https://discuss.elastic.co/t/kibana-8-19-20-9-4-5-9-5-1-security-update-esa-2026-129/389532&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260815211214&#34;, &#34;collected_at&#34;: &#34;20260815211219&#34;, &#34;content_hash&#34;: &#34;542ffa9f54e529beb6a0ea73a93a2bc93a1863c2ed2c9c9871050a1986818ef6&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-72643&#34;, &#34;sw_name&#34;: &#34;Elasticsearch&#34;, &#34;vendor&#34;: &#34;Elastic&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;HIGH&#34;, &#34;cvss_score&#34;: 7.1, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:L/A:N&#34;, &#34;published_date&#34;: &#34;20260813&#34;, &#34;modified_date&#34;: &#34;20260813&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] Kibana Agent Builder determines whether a caller owns a private agent by comparing a stable user identifier when one is recorded, and falling back to a comparison of the username when it is not. A username is not unique across Elasticsearch authentication realms, so two distinct principals that share a username in different realms are treated as the same owner. This discloses the configuration and instructions of an agent the caller does not own, and allows that agent to be altered or removed.&#34;, &#34;reference_url&#34;: &#34;https://discuss.elastic.co/t/kibana-9-4-5-9-5-1-security-update-esa-2026-124/389538&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260815211214&#34;, &#34;collected_at&#34;: &#34;20260815211219&#34;, &#34;content_hash&#34;: &#34;40e32a057d65cfdbf96ed70e43c5834594d006a3a50aae95526e4ea69999f3e1&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-72675&#34;, &#34;sw_name&#34;: &#34;Elasticsearch&#34;, &#34;vendor&#34;: &#34;Elastic&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;HIGH&#34;, &#34;cvss_score&#34;: 7.1, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:L/A:N&#34;, &#34;published_date&#34;: &#34;20260813&#34;, &#34;modified_date&#34;: &#34;20260813&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] Missing Authorization (CWE-862) in Kibana can lead to cross-space information disclosure and unauthorized data modification via Privilege Abuse (CAPEC-122). Kibana Machine Learning carries out its Elasticsearch operations with elevated internal permissions and relies on a per-request space filter to keep the machine learning data of one space separated from another. Part of the Machine Learning functionality did not apply that filter, so operations issued from one space were carried out against the machine learning data of every space in the deployment.&#34;, &#34;reference_url&#34;: &#34;https://discuss.elastic.co/t/kibana-8-19-20-and-9-4-5-security-update-esa-2026-92/389526&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260815211214&#34;, &#34;collected_at&#34;: &#34;20260815211219&#34;, &#34;content_hash&#34;: &#34;05c834b90fc452e757f5b875e5611c227a0387376ad260a3c6c83e083e7838d2&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-59714&#34;, &#34;sw_name&#34;: &#34;Open WebUI&#34;, &#34;vendor&#34;: &#34;Open WebUI&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;HIGH&#34;, &#34;cvss_score&#34;: 7.1, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:L&#34;, &#34;published_date&#34;: &#34;20260813&#34;, &#34;modified_date&#34;: &#34;20260814&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] Open WebUI is an extensible, feature-rich, and user-friendly self-hosted AI platform. From 0.9.5 before 0.10.0, any authenticated user can overwrite the content of a message in a channel they do not belong to (including private and DM channels) by sending a chat completion request with a channel:-prefixed chat_id and a target message_id. The channel: path routes pipeline output through _make_channel_emitter, which writes to the Messages table using the caller-supplied message_id without binding it to the channel. This issue is fixed in version 0.10.0.&#34;, &#34;reference_url&#34;: &#34;https://github.com/open-webui/open-webui/commit/ac3449cac91e62b08a7c28e54fcd044d14dea791&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260816211121&#34;, &#34;collected_at&#34;: &#34;20260816211125&#34;, &#34;content_hash&#34;: &#34;4ddabe9be9deaa68f99ed3f0d4ed142011f6d920c636c8c2a1ade7e773832a26&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-73499&#34;, &#34;sw_name&#34;: &#34;gRPC&#34;, &#34;vendor&#34;: &#34;gRPC Authors&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;HIGH&#34;, &#34;cvss_score&#34;: 7.1, &#34;cvss_vector&#34;: &#34;CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X&#34;, &#34;published_date&#34;: &#34;20260812&#34;, &#34;modified_date&#34;: &#34;20260814&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] etcd is a distributed key-value store for the data of a distributed system. Prior to versions 3.5.33, 3.6.14, and 3.7.1, a user granted READ permission on a single exact key can use the Watch gRPC API with clientv3.WithFromKey() to receive watch events for every key lexicographically greater than or equal to the permitted key. In server/etcdserver/api/v3rpc/watch.go, the open-ended RangeEnd sentinel is rewritten before the RBAC permission check in server/auth/range_perm_cache.go function isRangeOpPermitted, causing the request to be treated as an exact-key watch. Range/Get and DeleteRange requests are not affected, and the issue affects only clusters with authentication enabled. This issue is fixed in versions 3.5.33, 3.6.14, and 3.7.1.&#34;, &#34;reference_url&#34;: &#34;https://github.com/etcd-io/etcd/commit/6643f80602461a6095c9b294b6512fd9719bef41&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260816211121&#34;, &#34;collected_at&#34;: &#34;20260816211125&#34;, &#34;content_hash&#34;: &#34;20b99ebac1fd165c9938442747c974b25ffbbb72d53da74d8c5cea3f15d9a908&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-72771&#34;, &#34;sw_name&#34;: &#34;n8n&#34;, &#34;vendor&#34;: &#34;n8n GmbH&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;HIGH&#34;, &#34;cvss_score&#34;: 7.1, &#34;cvss_vector&#34;: &#34;CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:L/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X&#34;, &#34;published_date&#34;: &#34;20260811&#34;, &#34;modified_date&#34;: &#34;20260814&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] n8n versions before 2.32.1 fail to enforce the Allowed HTTP Request Domains allowlist in multiple AI and LLM nodes when user-supplied base or endpoint URLs are configured. Low-privileged workflow editors with use-only access to shared credentials can redirect requests to attacker-controlled hosts and exfiltrate credential secrets for reuse against underlying services.&#34;, &#34;reference_url&#34;: &#34;https://github.com/n8n-io/n8n/security/advisories/GHSA-64xh-79j6-r5v8&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;npm&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260816211121&#34;, &#34;collected_at&#34;: &#34;20260816211125&#34;, &#34;content_hash&#34;: &#34;3ace6e22fd709a3eb0751bba6d56bbb0e8acc9ed98c9af8bc0d3586fe6c12eda&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-73415&#34;, &#34;sw_name&#34;: &#34;JupyterLab&#34;, &#34;vendor&#34;: &#34;Project Jupyter&#34;, &#34;affected_range&#34;: &#34;&gt;=4.6.0,&lt;4.6.2|&lt;4.5.10&#34;, &#34;fixed_version&#34;: &#34;4.6.2&#34;, &#34;severity&#34;: &#34;HIGH&#34;, &#34;cvss_score&#34;: null, &#34;cvss_vector&#34;: &#34;CVSS:4.0/AV:N/AC:H/AT:N/PR:N/UI:A/VC:H/VI:H/VA:L/SC:N/SI:N/SA:N&#34;, &#34;published_date&#34;: &#34;20260722&#34;, &#34;modified_date&#34;: &#34;20260813&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;JupyterLab&#39;s image viewer allows for cross-site scripting (XSS) when a specially-crafted image file is opened through the image viewer and then opened in a new tab. This XSS issue can be used to cause remote code execution (RCE) on the JupyterLab server. ### Impact This vulnerability allows for arbitrary code execution. ### Patches JupyterLab [`v4.6.2`](https://github.com/jupyterlab/jupyterlab/releases/tag/v4.6.2) and [`v4.5.10`](https://github.com/jupyterlab/jupyterlab/releases/tag/v4.5.10) contain the patch. ### Workarounds Disable the image viewer plugin: ``` jupyter labextension disable @jupyterlab/imageviewer-extension:plugin ``` Confirm with: ``` jupyter labextension list ```&#34;, &#34;reference_url&#34;: &#34;https://github.com/jupyterlab/jupyterlab/security/advisories/GHSA-gx64-gj6p-pc4c&#34;, &#34;source&#34;: &#34;OSV&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260815211214&#34;, &#34;collected_at&#34;: &#34;20260815211215&#34;, &#34;content_hash&#34;: &#34;5bf371c1f6044ee3c134d07dd14c135937aba2ea36790209e6ac3f560688e862&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-72749&#34;, &#34;sw_name&#34;: &#34;n8n&#34;, &#34;vendor&#34;: &#34;n8n GmbH&#34;, &#34;affected_range&#34;: &#34;&lt;1.123.67|&gt;=2.32.0,&lt;2.32.1|&gt;=2.0.0-rc.0,&lt;2.31.5&#34;, &#34;fixed_version&#34;: &#34;1.123.67&#34;, &#34;severity&#34;: &#34;HIGH&#34;, &#34;cvss_score&#34;: null, &#34;cvss_vector&#34;: &#34;CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N&#34;, &#34;published_date&#34;: &#34;20260722&#34;, &#34;modified_date&#34;: &#34;20260812&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;## Impact The Edit Fields (Set) node assigned output fields through a dot-notation path setter without restricting the field name, so an authenticated user could name a field after an inherited built-in method path and corrupt a shared global in the main Node.js process. Because that global was used on the request-authentication path, the instance then failed every authenticated request, causing a instance-wide denial of service for all users until the process was restarted. ## Patches The issue has been fixed in n8n versions 1.123.67, 2.31.5, and 2.32.1. Users should upgrade to one of these versions or later to remediate the vulnerability. ## Workarounds If upgrading is not immediately possible, administrators should consider the following temporary mitigations: - Restrict n8n instance access to fully trusted users only. - Disable or restrict workflow creation and execution permissions for untrusted users. - Monitor for unexpected process-wide HTTP 500 errors and restart the process p&#34;, &#34;reference_url&#34;: &#34;https://github.com/n8n-io/n8n/security/advisories/GHSA-xwx6-jjhv-84p8&#34;, &#34;source&#34;: &#34;OSV&#34;, &#34;ecosystem&#34;: &#34;npm&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260814211606&#34;, &#34;collected_at&#34;: &#34;20260814211606&#34;, &#34;content_hash&#34;: &#34;ad8dee88da2fdab78539d2bebb74eef109ed88723477fa472e9f4ac20f8d9cfc&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-72762&#34;, &#34;sw_name&#34;: &#34;n8n&#34;, &#34;vendor&#34;: &#34;n8n GmbH&#34;, &#34;affected_range&#34;: &#34;&lt;1.123.67|&gt;=2.32.0,&lt;2.32.1|&gt;=2.0.0-rc.0,&lt;2.31.5&#34;, &#34;fixed_version&#34;: &#34;1.123.67&#34;, &#34;severity&#34;: &#34;HIGH&#34;, &#34;cvss_score&#34;: null, &#34;cvss_vector&#34;: &#34;CVSS:4.0/AV:N/AC:H/AT:P/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N&#34;, &#34;published_date&#34;: &#34;20260722&#34;, &#34;modified_date&#34;: &#34;20260812&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;## Impact The n8n Edit Image node passed its output format to the underlying image library without validation, so a crafted value could write bytes to a location outside the node&#39;s working directory. An authenticated user able to run workflows could use this to write arbitrary files in the n8n instance. ## Patches The issue has been fixed in n8n versions 1.123.67, 2.31.5, and 2.32.1. Users should upgrade to one of these versions or later to remediate the vulnerability. ## Workarounds If upgrading is not immediately possible, administrators should consider the following temporary mitigations: - Restrict n8n instance access to fully trusted users only. - Disable the Edit Image node by adding `n8n-nodes-base.editImage` to the `NODES_EXCLUDE` environment variable. These workarounds do not fully remediate the risk and should only be used as short-term mitigation measures.&#34;, &#34;reference_url&#34;: &#34;https://github.com/n8n-io/n8n/security/advisories/GHSA-xmc9-4f2h-jf9c&#34;, &#34;source&#34;: &#34;OSV&#34;, &#34;ecosystem&#34;: &#34;npm&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260814211606&#34;, &#34;collected_at&#34;: &#34;20260814211606&#34;, &#34;content_hash&#34;: &#34;5a7d685b291a5821421e82c1f6c637058172cc188c5bbe89ac1eb0d32ba2557c&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-72763&#34;, &#34;sw_name&#34;: &#34;n8n&#34;, &#34;vendor&#34;: &#34;n8n GmbH&#34;, &#34;affected_range&#34;: &#34;&lt;1.123.67|&gt;=2.32.0,&lt;2.32.1|&gt;=2.0.0-rc.0,&lt;2.31.5&#34;, &#34;fixed_version&#34;: &#34;1.123.67&#34;, &#34;severity&#34;: &#34;HIGH&#34;, &#34;cvss_score&#34;: null, &#34;cvss_vector&#34;: &#34;CVSS:4.0/AV:N/AC:L/AT:P/PR:L/UI:N/VC:H/VI:N/VA:N/SC:H/SI:H/SA:L&#34;, &#34;published_date&#34;: &#34;20260722&#34;, &#34;modified_date&#34;: &#34;20260812&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;## Impact n8n&#39;s credential-access checks validated only a node&#39;s top-level credentials, not credentials referenced inside an Execute Sub-workflow node&#39;s inline workflow JSON. A member with editor access to a shared workflow could reference a credential they were not permitted to use inside that inline JSON; it passed both save-time and runtime validation and resolved in the parent workflow&#39;s project context, letting the member use or exfiltrate a credential they could not otherwise access. Exploitation requires workflow sharing to be enabled and the attacker to have been explicitly granted Editor access to a shared workflow. The attacker must also know the target credential&#39;s ID. ## Patches The issue has been fixed in n8n versions 1.123.67, 2.31.5, and 2.32.1. Users should upgrade to one of these versions or later to remediate the vulnerability. ## Workarounds If upgrading is not immediately possible, administrators should consider the following temporary mitigations: - Restrict workfl&#34;, &#34;reference_url&#34;: &#34;https://github.com/n8n-io/n8n/security/advisories/GHSA-cj9h-qx8g-pq2g&#34;, &#34;source&#34;: &#34;OSV&#34;, &#34;ecosystem&#34;: &#34;npm&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260814211606&#34;, &#34;collected_at&#34;: &#34;20260814211606&#34;, &#34;content_hash&#34;: &#34;ef6f97e8707dc58d98649d88b71a886fa3580f4b26c671f787d8a4578cde5926&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-72765&#34;, &#34;sw_name&#34;: &#34;n8n&#34;, &#34;vendor&#34;: &#34;n8n GmbH&#34;, &#34;affected_range&#34;: &#34;&gt;=2.32.0,&lt;2.32.1|&lt;2.31.5&#34;, &#34;fixed_version&#34;: &#34;2.32.1&#34;, &#34;severity&#34;: &#34;HIGH&#34;, &#34;cvss_score&#34;: null, &#34;cvss_vector&#34;: &#34;CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N&#34;, &#34;published_date&#34;: &#34;20260722&#34;, &#34;modified_date&#34;: &#34;20260812&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;## Impact An authenticated user with permission to create or modify workflows could abuse crafted expressions using arrow functions to bypass the expression sandbox, triggering unintended system command execution on the host running n8n. ## Patches The issue has been fixed in n8n versions 2.31.5 and 2.32.1. Users should upgrade to one of these versions or later to remediate the vulnerability. ## Workarounds If upgrading is not immediately possible, administrators should consider the following temporary mitigations: - Restrict n8n instance access to fully trusted users only. - Restrict workflow creation and editing permissions to fully trusted users only. These workarounds do not fully remediate the risk and should only be used as short-term mitigation measures.&#34;, &#34;reference_url&#34;: &#34;https://github.com/n8n-io/n8n/security/advisories/GHSA-gv7g-jm28-cr3m&#34;, &#34;source&#34;: &#34;OSV&#34;, &#34;ecosystem&#34;: &#34;npm&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260814211606&#34;, &#34;collected_at&#34;: &#34;20260814211606&#34;, &#34;content_hash&#34;: &#34;2b6d8b23cee4b58ec220ef60e474ae64e73e282d0a485ce75259d051b7d3a835&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-72767&#34;, &#34;sw_name&#34;: &#34;n8n&#34;, &#34;vendor&#34;: &#34;n8n GmbH&#34;, &#34;affected_range&#34;: &#34;&lt;1.123.67|&gt;=2.32.0,&lt;2.32.1|&gt;=2.0.0-rc.0,&lt;2.31.5&#34;, &#34;fixed_version&#34;: &#34;1.123.67&#34;, &#34;severity&#34;: &#34;HIGH&#34;, &#34;cvss_score&#34;: null, &#34;cvss_vector&#34;: &#34;CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N&#34;, &#34;published_date&#34;: &#34;20260722&#34;, &#34;modified_date&#34;: &#34;20260812&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;## Impact Authenticated n8n users with rights to create and execute workflows could achieve code execution on the n8n host. Using the Git node, under the default `git` security settings, by staging a crafted local repository, an attacker could cause `git` to run hooks, executing arbitrary commands as the n8n process user. Both self-hosted and cloud instances are affected where authenticated users can create and execute workflows using the Git node. ## Patches The issue has been fixed in n8n versions 1.123.67, 2.31.5, and 2.32.1. Users should upgrade to one of these versions or later to remediate the vulnerability. ## Workarounds If upgrading is not immediately possible, administrators should consider the following temporary mitigations: - Restrict n8n instance access to fully trusted users only. - Disable the Git node by adding `n8n-nodes-base.git` to the `NODES_EXCLUDE` environment variable. - Restrict network egress from the n8n instance to limit the impact of arbitrary code executio&#34;, &#34;reference_url&#34;: &#34;https://github.com/n8n-io/n8n/security/advisories/GHSA-rcv6-pvrj-4xcg&#34;, &#34;source&#34;: &#34;OSV&#34;, &#34;ecosystem&#34;: &#34;npm&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260814211606&#34;, &#34;collected_at&#34;: &#34;20260814211606&#34;, &#34;content_hash&#34;: &#34;560a07e31630b60fd6ee35871f3c6095159cf89bfab9d08121031f3d00afafdd&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-72770&#34;, &#34;sw_name&#34;: &#34;n8n&#34;, &#34;vendor&#34;: &#34;n8n GmbH&#34;, &#34;affected_range&#34;: &#34;&lt;1.123.67|&gt;=2.32.0,&lt;2.32.1|&gt;=2.0.0-rc.0,&lt;2.31.5&#34;, &#34;fixed_version&#34;: &#34;1.123.67&#34;, &#34;severity&#34;: &#34;HIGH&#34;, &#34;cvss_score&#34;: null, &#34;cvss_vector&#34;: &#34;CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:N/VA:N/SC:N/SI:N/SA:N&#34;, &#34;published_date&#34;: &#34;20260722&#34;, &#34;modified_date&#34;: &#34;20260812&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;## Impact Authenticated n8n users with workflow create/execute rights could use the Git node&#39;s fetch, pull, or push-tags operations to bypass the repository-path containment checks that already protected clone and push. By pointing an allowlisted remote configuration value at a local path outside the intended sandbox, an attacker could pull an arbitrary local git repository into the workspace and subsequently read its files and history. ## Patches The issue has been fixed in n8n versions 1.123.67, 2.31.5, and 2.32.1. Users should upgrade to one of these versions or later to remediate the vulnerability. ## Workarounds If upgrading is not immediately possible, administrators should consider the following temporary mitigations: - Restrict n8n instance access to fully trusted users only. - Disable the Git node by adding `n8n-nodes-base.git` to the `NODES_EXCLUDE` environment variable. These workarounds do not fully remediate the risk and should only be used as short-term mitigation measure&#34;, &#34;reference_url&#34;: &#34;https://github.com/n8n-io/n8n/security/advisories/GHSA-gf29-4f56-r2jf&#34;, &#34;source&#34;: &#34;OSV&#34;, &#34;ecosystem&#34;: &#34;npm&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260814211606&#34;, &#34;collected_at&#34;: &#34;20260814211606&#34;, &#34;content_hash&#34;: &#34;fda9432dc6d9be1ceeb4324dc44f6f40fbe6c510000d53557091e5c47806b2e0&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-72772&#34;, &#34;sw_name&#34;: &#34;n8n&#34;, &#34;vendor&#34;: &#34;n8n GmbH&#34;, &#34;affected_range&#34;: &#34;&gt;=2.32.0,&lt;2.32.1|&lt;2.31.5&#34;, &#34;fixed_version&#34;: &#34;2.32.1&#34;, &#34;severity&#34;: &#34;HIGH&#34;, &#34;cvss_score&#34;: null, &#34;cvss_vector&#34;: &#34;CVSS:4.0/AV:N/AC:L/AT:P/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:L&#34;, &#34;published_date&#34;: &#34;20260722&#34;, &#34;modified_date&#34;: &#34;20260812&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;## Impact In an n8n instance, when a validly-signed incoming token was matched to a local account by its email claim, the service did not check that the trusted key&#39;s permitted role ceiling covered that account, nor that the email claim was verified. As a result, anyone able to obtain a token accepted by one of the configured trusted keys, for example a trusted issuer that emitted unverified email addresses, could authenticate as any existing user, gaining full account control. This issue only affects instances where the embed login feature is enabled and at least one trusted key source is configured. ## Patches The issue has been fixed in n8n version 2.32.1. Users should upgrade to this version or later to remediate the vulnerability. ## Workarounds If upgrading is not immediately possible, administrators should consider the following temporary mitigations: - Disable the embed login feature by setting `N8N_TOKEN_EXCHANGE_ENABLED=false`. - If embed login cannot be disabled, restrict ne&#34;, &#34;reference_url&#34;: &#34;https://github.com/n8n-io/n8n/security/advisories/GHSA-8342-988q-86cr&#34;, &#34;source&#34;: &#34;OSV&#34;, &#34;ecosystem&#34;: &#34;npm&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260814211606&#34;, &#34;collected_at&#34;: &#34;20260814211606&#34;, &#34;content_hash&#34;: &#34;4602b348c08b49155147b14e5928333e8f58bf9d1df53aafc0a61a5cb5b99fff&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-72774&#34;, &#34;sw_name&#34;: &#34;n8n&#34;, &#34;vendor&#34;: &#34;n8n GmbH&#34;, &#34;affected_range&#34;: &#34;&lt;1.123.67|&gt;=2.32.0,&lt;2.32.1|&gt;=2.0.0-rc.0,&lt;2.31.5&#34;, &#34;fixed_version&#34;: &#34;1.123.67&#34;, &#34;severity&#34;: &#34;HIGH&#34;, &#34;cvss_score&#34;: null, &#34;cvss_vector&#34;: &#34;CVSS:4.0/AV:N/AC:L/AT:P/PR:L/UI:N/VC:H/VI:N/VA:N/SC:H/SI:H/SA:N&#34;, &#34;published_date&#34;: &#34;20260722&#34;, &#34;modified_date&#34;: &#34;20260812&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;## Impact An authenticated member with edit access to a shared workflow could reference another user&#39;s credential in an HTTP Request node while specifying the credential type through an expression. Because the pre-execution permission check compared the unresolved expression instead of the real credential type, the ownership check was skipped and the credential was loaded at execution time, letting the member use or exfiltrate a credential they were never granted. Exploitation required knowing the target credential&#39;s identifier. ## Patches The issue has been fixed in n8n versions 1.123.67, 2.31.5, and 2.32.1. Users should upgrade to one of these versions or later to remediate the vulnerability. ## Workarounds If upgrading is not immediately possible, administrators should consider the following temporary mitigations: - Restrict n8n instance access to fully trusted users only. - Exclude the HTTP Request node by adding `n8n-nodes-base.httpRequest` to the `NODES_EXCLUDE` environment varia&#34;, &#34;reference_url&#34;: &#34;https://github.com/n8n-io/n8n/security/advisories/GHSA-6qc9-mqvw-jg7x&#34;, &#34;source&#34;: &#34;OSV&#34;, &#34;ecosystem&#34;: &#34;npm&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260814211606&#34;, &#34;collected_at&#34;: &#34;20260814211606&#34;, &#34;content_hash&#34;: &#34;808f5155b0dcbf80aa14f63067fd62d797088a61d56ba19bc7f1511cb41d21f0&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-27765&#34;, &#34;sw_name&#34;: &#34;vLLM&#34;, &#34;vendor&#34;: &#34;vLLM Project&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;MEDIUM&#34;, &#34;cvss_score&#34;: 6.8, &#34;cvss_vector&#34;: &#34;CVSS:4.0/AV:L/AC:L/AT:N/PR:L/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X&#34;, &#34;published_date&#34;: &#34;20260811&#34;, &#34;modified_date&#34;: &#34;20260812&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] Improper input validation for some vLLM Hardware Plugin for Intel(R) Gaudi(R) software before version 0.16.0 within Ring 3: User Applications may allow a denial of service. Authorized adversary with an authenticated user combined with a low complexity attack may enable denial of service. This result may potentially occur via loca
