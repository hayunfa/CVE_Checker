l access when attack requirements are not present without special internal knowledge and requires no user interaction. The potential vulnerability may impact the confidentiality (none), integrity (none) and availability (high) of the vulnerable system, resulting in subsequent system confidentiality (none), integrity (none) and availability (none) impacts.&#34;, &#34;reference_url&#34;: &#34;https://intel.com/content/www/us/en/security-center/advisory/intel-sa-01487.html&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260814211606&#34;, &#34;collected_at&#34;: &#34;20260814211613&#34;, &#34;content_hash&#34;: &#34;7b83cac5906b8cdcd8cc333ed59fcc9e3155a4896a43af75a55bfdd28daad108&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-49296&#34;, &#34;sw_name&#34;: &#34;Airflow&#34;, &#34;vendor&#34;: &#34;Apache Software Foundation&#34;, &#34;affected_range&#34;: &#34;&lt;3.3.0&#34;, &#34;fixed_version&#34;: &#34;3.3.0&#34;, &#34;severity&#34;: &#34;MEDIUM&#34;, &#34;cvss_score&#34;: 6.5, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:N&#34;, &#34;published_date&#34;: &#34;20260707&#34;, &#34;modified_date&#34;: &#34;20260812&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;apache-airflow DAG source authorization bypass exposes co-located DAG source Before apache-airflow 3.3.0, a user authorized to read one Dag could disclose the source of other Dags co-located in the same source file. `GET /api/v2/dagSources/{dag_id}` — and the equivalent Dag-source view in the UI — returned the entire source file without redacting Dags the caller was not authorized to read, bypassing per-DAG read authorization. Deployments that co-locate multiple Dags in a single file and rely on per-DAG access control to limit source visibility are affected; single-Dag-per-file deployments are not. Upgrade to apache-airflow 3.3.0 or later.&#34;, &#34;reference_url&#34;: &#34;https://github.com/advisories/GHSA-4fh7-7jx4-8f6c&#34;, &#34;source&#34;: &#34;OSV+GHSA&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260814211606&#34;, &#34;collected_at&#34;: &#34;20260814211702&#34;, &#34;content_hash&#34;: &#34;49c121898e47ed7a451c12aba74f33e193f7956e470a03937e51b6145c995068&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-59244&#34;, &#34;sw_name&#34;: &#34;Airflow&#34;, &#34;vendor&#34;: &#34;apache&#34;, &#34;affected_range&#34;: &#34;&lt;3.3.1&#34;, &#34;fixed_version&#34;: &#34;3.3.1&#34;, &#34;severity&#34;: &#34;MEDIUM&#34;, &#34;cvss_score&#34;: 6.5, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:N&#34;, &#34;published_date&#34;: &#34;20260812&#34;, &#34;modified_date&#34;: &#34;20260814&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;Apache Airflow&#39;s secrets masker did not mask `var.json` Variable values whose value is a dict in the Rendered Templates UI — the dict value failed an `isinstance(str)` guard — so a secret stored as a JSON Variable and referenced in a template via `var.json` was displayed in cleartext to any user with access to that task&#39;s Rendered Templates view. Users are advised to upgrade to apache-airflow 3.3.1 or later, which masks nested Variable values regardless of type.&#34;, &#34;reference_url&#34;: &#34;https://github.com/apache/airflow/pull/68975&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260816211121&#34;, &#34;collected_at&#34;: &#34;20260816211125&#34;, &#34;content_hash&#34;: &#34;2485e83395d6f3cc485e0b78b3824ec7c28fb4bbde45abbb091a6734f064e045&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-65017&#34;, &#34;sw_name&#34;: &#34;Airflow&#34;, &#34;vendor&#34;: &#34;apache&#34;, &#34;affected_range&#34;: &#34;&gt;=3.3.0,&lt;3.3.1&#34;, &#34;fixed_version&#34;: &#34;3.3.1&#34;, &#34;severity&#34;: &#34;MEDIUM&#34;, &#34;cvss_score&#34;: 6.5, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:N&#34;, &#34;published_date&#34;: &#34;20260812&#34;, &#34;modified_date&#34;: &#34;20260814&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;Apache Airflow&#39;s Config API did not mask team-scoped sensitive configuration values in multi-team deployments. When an administrator has enabled multi-team mode and exposed the Config API, an authenticated Viewer holding only configuration-read access — with no prior access to the secret — could read a team-scoped Celery broker URL, including its embedded credentials, in cleartext, while the equivalent global option was correctly masked. The secrets masker matched only base section and option names and did not normalize team-prefixed sections before the sensitivity check (CWE-200). This is a distinct masker bypass from CVE-2026-48828 and CVE-2026-48892: deployments that upgraded to apache-airflow 3.3.0 to address those issues remain affected by this team-scoped variant. Users are advised to upgrade to apache-airflow 3.3.1 or later, which normalizes team-scoped sections before masking.&#34;, &#34;reference_url&#34;: &#34;https://github.com/apache/airflow/pull/70755&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260816211121&#34;, &#34;collected_at&#34;: &#34;20260816211125&#34;, &#34;content_hash&#34;: &#34;2f80120d2820e2d21d8342cd08c1c95202a0607069ecc481f92f07fc3b24cdd1&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-68868&#34;, &#34;sw_name&#34;: &#34;Airflow&#34;, &#34;vendor&#34;: &#34;Apache Software Foundation&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;MEDIUM&#34;, &#34;cvss_score&#34;: 6.5, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:N&#34;, &#34;published_date&#34;: &#34;20260812&#34;, &#34;modified_date&#34;: &#34;20260812&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] The Google Cloud Secret Manager secrets backend in Apache Airflow&#39;s Google provider never applied the team scope when resolving Connections and Variables: the caller&#39;s `team_name` was accepted by the backend but dropped at the internal call boundary, so every lookup resolved against the team-agnostic secret name. In a deployment running multi-team mode with this backend, a task or Dag belonging to one team resolved another team&#39;s Connection or Variable, obtaining its credentials in full. No unusual configuration is required beyond enabling multi-team mode and using this backend. Users are advised to upgrade to apache-airflow-providers-google 22.3.0 or later, which builds and applies the team-scoped secret name.&#34;, &#34;reference_url&#34;: &#34;https://github.com/apache/airflow/pull/70869&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260814211606&#34;, &#34;collected_at&#34;: &#34;20260814211613&#34;, &#34;content_hash&#34;: &#34;6c6dce6ff272a1385e2fef58ebc421f78ef397c09cf75b3382310a2bcc4a3d88&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-68871&#34;, &#34;sw_name&#34;: &#34;Airflow&#34;, &#34;vendor&#34;: &#34;Apache Software Foundation&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;MEDIUM&#34;, &#34;cvss_score&#34;: 6.5, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:N&#34;, &#34;published_date&#34;: &#34;20260810&#34;, &#34;modified_date&#34;: &#34;20260812&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] The Yandex Lockbox secrets backend in Apache Airflow&#39;s Yandex provider resolved a team-scoped Connection or Variable id through the team-agnostic lookup when the team-scoped lookup missed. In a deployment running multi-team mode with this backend, a caller in one team could resolve a secret belonging to another team by supplying an id that spells out that team&#39;s namespace, obtaining its credentials in full. No unusual configuration is required beyond enabling multi-team mode and using this backend. Users are advised to upgrade to apache-airflow-providers-yandex 4.5.1 or later, which refuses the team-agnostic fall-through for an id that could name a team namespace.&#34;, &#34;reference_url&#34;: &#34;https://github.com/apache/airflow/pull/70877&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260814211606&#34;, &#34;collected_at&#34;: &#34;20260814211613&#34;, &#34;content_hash&#34;: &#34;25473afa891b0a4a58cf8e30d822ba5f54bc255e87a7d3f457a8d13f4a2ec1ef&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-68872&#34;, &#34;sw_name&#34;: &#34;Airflow&#34;, &#34;vendor&#34;: &#34;Apache Software Foundation&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;MEDIUM&#34;, &#34;cvss_score&#34;: 6.5, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:N&#34;, &#34;published_date&#34;: &#34;20260810&#34;, &#34;modified_date&#34;: &#34;20260812&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] The AWS Systems Manager Parameter Store and Secrets Manager backends in Apache Airflow&#39;s Amazon provider resolved a team-scoped Connection or Variable id through the team-agnostic lookup when the team-scoped lookup missed. In a deployment running multi-team mode with either backend, a caller in one team could resolve a secret belonging to another team by supplying an id that spells out that team&#39;s namespace, obtaining its credentials in full. No unusual configuration is required beyond enabling multi-team mode and using one of these backends. Users are advised to upgrade to apache-airflow-providers-amazon 9.34.0 or later, which refuses the team-agnostic fall-through for an id that could name a team namespace.&#34;, &#34;reference_url&#34;: &#34;https://github.com/apache/airflow/pull/70878&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260814211606&#34;, &#34;collected_at&#34;: &#34;20260814211613&#34;, &#34;content_hash&#34;: &#34;a525cd2cb4fc760ebf7a8340fda2918eb67d687a57269705359de211d47d1dd4&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-68969&#34;, &#34;sw_name&#34;: &#34;Airflow&#34;, &#34;vendor&#34;: &#34;apache&#34;, &#34;affected_range&#34;: &#34;&lt;3.3.1&#34;, &#34;fixed_version&#34;: &#34;3.3.1&#34;, &#34;severity&#34;: &#34;MEDIUM&#34;, &#34;cvss_score&#34;: 6.5, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:N&#34;, &#34;published_date&#34;: &#34;20260812&#34;, &#34;modified_date&#34;: &#34;20260813&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;Apache Airflow wrote Variable values and Connection `extra` contents to the audit log in cleartext when they were submitted through the bulk endpoints (`PATCH /api/v2/variables` and `PATCH /api/v2/connections`). The audit-log masking recognised only top-level request fields, and a bulk request nests its entities two levels below, so no masking was applied to them. Any authenticated user with audit-log read access -- who need not hold Variables or Connections read at all -- could recover those secrets verbatim, and the Connection `extra` copy is stored unencrypted in the log while the connection table encrypts it. The Airflow UI&#39;s *Import Variables* action posts to this endpoint, so an ordinary operator import wrote every secret in the file to the log. This is a different code path from CVE-2026-50204: that fix shipped in 3.3.0 and covers the single-entity endpoints only, so deployments that upgraded in response to that advisory remain affected and must upgrade again. Users are advised &#34;, &#34;reference_url&#34;: &#34;https://github.com/apache/airflow/pull/70890&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260815211214&#34;, &#34;collected_at&#34;: &#34;20260815211219&#34;, &#34;content_hash&#34;: &#34;eb08402da447e81d0c1db317530974b187c2375f361e492690203451572c4146&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-68970&#34;, &#34;sw_name&#34;: &#34;Airflow&#34;, &#34;vendor&#34;: &#34;apache&#34;, &#34;affected_range&#34;: &#34;&lt;3.3.1&#34;, &#34;fixed_version&#34;: &#34;3.3.1&#34;, &#34;severity&#34;: &#34;MEDIUM&#34;, &#34;cvss_score&#34;: 6.5, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:N&#34;, &#34;published_date&#34;: &#34;20260812&#34;, &#34;modified_date&#34;: &#34;20260814&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;Apache Airflow&#39;s Task SDK did not mask the contents of a Variable whose JSON value is a list, so secrets stored in that shape appeared in cleartext in task logs and in the Rendered Templates UI. Masking was applied only when the deserialized value was a string or a dict; a list at the top level matched neither and was returned unmasked. Any authenticated user able to read the logs or rendered templates of a task that references such a Variable could recover the values, with no special configuration required. This is the list-shaped counterpart of CVE-2026-59244, whose fix covered the dict case only, so deployments that upgraded in response to that advisory remain affected and must upgrade again. Users are advised to upgrade to apache-airflow 3.3.1 or later.&#34;, &#34;reference_url&#34;: &#34;https://github.com/apache/airflow/pull/70891&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260816211121&#34;, &#34;collected_at&#34;: &#34;20260816211125&#34;, &#34;content_hash&#34;: &#34;7ecdae8cc5ab41f6866c4529c6f73fbf9b420f5f2c0ba938a1cec5e8e8e42b5a&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-68971&#34;, &#34;sw_name&#34;: &#34;Airflow&#34;, &#34;vendor&#34;: &#34;apache&#34;, &#34;affected_range&#34;: &#34;&lt;3.3.1&#34;, &#34;fixed_version&#34;: &#34;3.3.1&#34;, &#34;severity&#34;: &#34;MEDIUM&#34;, &#34;cvss_score&#34;: 6.5, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:N&#34;, &#34;published_date&#34;: &#34;20260812&#34;, &#34;modified_date&#34;: &#34;20260813&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;Apache Airflow&#39;s asset materialization endpoint (`POST /api/v2/assets/{asset_id}/materialize`) and the XCom result check on `wait_dag_run_until_finished` authorized the target Dag without its team, unlike every other authorization site. A team-aware auth manager distinguishes a team-scoped Dag from a global one by that field -- the Keycloak auth manager, for example, checks the `DAG` resource instead of `DAG:&lt;team&gt;` -- so the team-scoped permission that should gate the request was never consulted. In a deployment running multi-team mode with a team-aware auth manager, an authenticated user in one team could trigger Dag runs belonging to another team, supplying their own `dag_run_id` and `conf`, and could read another team&#39;s XCom values. Deployments using the FAB auth manager are unaffected, as it has no multi-team support. Users are advised to upgrade to apache-airflow 3.3.1 or later, which resolves the Dag&#39;s team at both sites.&#34;, &#34;reference_url&#34;: &#34;https://github.com/apache/airflow/pull/70893&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260815211214&#34;, &#34;collected_at&#34;: &#34;20260815211219&#34;, &#34;content_hash&#34;: &#34;d4cd14ceed64ccf3bdbfc90057ebbd69c68a53aa5a867c99afae1df89b28f67b&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-72631&#34;, &#34;sw_name&#34;: &#34;Elasticsearch&#34;, &#34;vendor&#34;: &#34;Elastic&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;MEDIUM&#34;, &#34;cvss_score&#34;: 6.5, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:N&#34;, &#34;published_date&#34;: &#34;20260813&#34;, &#34;modified_date&#34;: &#34;20260814&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] Improper Privilege Management (CWE-269) in Kibana Fleet can lead to privilege escalation via Privilege Escalation (CAPEC-233). An integration policy may optionally declare extra data streams that the integration writes to, which Fleet adds to the Elasticsearch API key issued to Elastic Agents enrolled in the corresponding agent policy. The resulting key allows new documents to be inserted and index mappings to be extended for specific indices. The key does not allow reading, updating, or deleting existing documents&#34;, &#34;reference_url&#34;: &#34;https://discuss.elastic.co/t/kibana-9-4-5-9-5-1-security-update-esa-2026-128/389539&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260816211121&#34;, &#34;collected_at&#34;: &#34;20260816211125&#34;, &#34;content_hash&#34;: &#34;211ffe480e6cd88b3f487f9517603108fb3f773b17a849e06bb67c6824143e46&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-72636&#34;, &#34;sw_name&#34;: &#34;Elasticsearch&#34;, &#34;vendor&#34;: &#34;Elastic&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;MEDIUM&#34;, &#34;cvss_score&#34;: 6.5, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:N/A:H&#34;, &#34;published_date&#34;: &#34;20260813&#34;, &#34;modified_date&#34;: &#34;20260813&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] Uncontrolled Recursion (CWE-674) in the Elasticsearch wildcard matching helper can lead to a denial of service via Excessive Allocation (CAPEC-130). The matcher used to resolve wildcard patterns against names is implemented recursively and had no bound on recursion depth or on the total number of match operations performed. A search request containing a wildcard pattern with a large number of wildcard groups, evaluated against a sufficiently long name, exhausts the thread stack. Elasticsearch treats a stack overflow as an unrecoverable condition and shuts the node down, so the request terminates the affected node rather than failing gracefully.&#34;, &#34;reference_url&#34;: &#34;https://discuss.elastic.co/t/elasticsearch-8-19-20-9-4-5-security-update-esa-2026-133/389499&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260815211214&#34;, &#34;collected_at&#34;: &#34;20260815211219&#34;, &#34;content_hash&#34;: &#34;a3f6c619a1dba8e915c204980f227429c958ea496b7a1913a58b0e37ec84137e&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-72638&#34;, &#34;sw_name&#34;: &#34;Elasticsearch&#34;, &#34;vendor&#34;: &#34;Elastic&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;MEDIUM&#34;, &#34;cvss_score&#34;: 6.5, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:N/A:H&#34;, &#34;published_date&#34;: &#34;20260813&#34;, &#34;modified_date&#34;: &#34;20260813&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] Uncontrolled Recursion (CWE-674) in Elasticsearch can lead to denial of service via Input Data Manipulation (CAPEC-153). An authenticated user holding only low-privileged index creation permissions can submit a single request containing a specially crafted, malformed custom analysis definition that is resolved recursively without a cycle or depth check, exhausting the thread stack and terminating the affected node.&#34;, &#34;reference_url&#34;: &#34;https://discuss.elastic.co/t/elasticsearch-8-19-20-9-4-5-security-update-esa-2026-119/389498&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260815211214&#34;, &#34;collected_at&#34;: &#34;20260815211219&#34;, &#34;content_hash&#34;: &#34;965fdacc64b9391b352413813b6fb193d9374c5d780e96c36990fe6b1cb3f724&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-72639&#34;, &#34;sw_name&#34;: &#34;Elasticsearch&#34;, &#34;vendor&#34;: &#34;Elastic&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;MEDIUM&#34;, &#34;cvss_score&#34;: 6.5, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:N/A:H&#34;, &#34;published_date&#34;: &#34;20260813&#34;, &#34;modified_date&#34;: &#34;20260813&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] Elasticsearch does not enforce an upper bound on a user-supplied count accepted by a search highlighting option, and the allocation derived from that count is not accounted against any circuit breaker. An authenticated user holding only read privileges on a single searchable index can submit one small search request that causes the node to reserve an excessively large internal data structure. The allocation occurs before the existing highlighting safety limits are evaluated, so memory exhaustion raises a fatal error that terminates the Elasticsearch node process. This results in a denial of service for the affected node and degrades cluster routing and health. The defect is not volumetric and does not depend on the size of the indexed data, so a single request is sufficient.&#34;, &#34;reference_url&#34;: &#34;https://discuss.elastic.co/t/elasticsearch-8-19-20-9-4-5-9-5-1-security-update-esa-2026-120/389503&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260815211214&#34;, &#34;collected_at&#34;: &#34;20260815211219&#34;, &#34;content_hash&#34;: &#34;221faa62db1fd72fb76a2c81de23c1a70c58d0e129ff9248dd4128f9f9cb9960&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-72645&#34;, &#34;sw_name&#34;: &#34;Elasticsearch&#34;, &#34;vendor&#34;: &#34;Elastic&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;MEDIUM&#34;, &#34;cvss_score&#34;: 6.5, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:N/A:H&#34;, &#34;published_date&#34;: &#34;20260813&#34;, &#34;modified_date&#34;: &#34;20260813&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] Memory Allocation with Excessive Size Value (CWE-789) in Elasticsearch can lead to denial of service via Excessive Allocation (CAPEC-130). An authenticated user holding only read privileges on a single index can submit one small, specially crafted search request that causes an excessively large memory allocation, exhausting the JVM heap and terminating the affected node.&#34;, &#34;reference_url&#34;: &#34;https://discuss.elastic.co/t/elasticsearch-8-19-20-9-4-5-9-5-1-security-update-esa-2026-116/389502&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260815211214&#34;, &#34;collected_at&#34;: &#34;20260815211219&#34;, &#34;content_hash&#34;: &#34;3281e70b6e571055c24074575d164776cf8160ed78cbb1ebd528062bcd9e56dd&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-72647&#34;, &#34;sw_name&#34;: &#34;Elasticsearch&#34;, &#34;vendor&#34;: &#34;Elastic&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;MEDIUM&#34;, &#34;cvss_score&#34;: 6.5, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:N/A:H&#34;, &#34;published_date&#34;: &#34;20260813&#34;, &#34;modified_date&#34;: &#34;20260813&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] Uncontrolled Recursion (CWE-674) in Elasticsearch can lead to denial of service via Serialized Data with Nested Payloads (CAPEC-230). An authenticated user holding only read privileges on a single index can submit one specially crafted search request whose deeply nested structure is processed without a depth limit, exhausting the thread stack and terminating the affected node.&#34;, &#34;reference_url&#34;: &#34;https://discuss.elastic.co/t/elasticsearch-8-19-20-9-4-5-9-5-1-security-update-esa-2026-118/389497&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260815211214&#34;, &#34;collected_at&#34;: &#34;20260815211219&#34;, &#34;content_hash&#34;: &#34;5e9d34cf6e488ebf9bcf902713cb4ee6cf7176965cc2dab96b7ef0e2967cb0b5&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-72648&#34;, &#34;sw_name&#34;: &#34;Elasticsearch&#34;, &#34;vendor&#34;: &#34;Elastic&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;MEDIUM&#34;, &#34;cvss_score&#34;: 6.5, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:N&#34;, &#34;published_date&#34;: &#34;20260813&#34;, &#34;modified_date&#34;: &#34;20260813&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] Cleartext Storage of Sensitive Information in an Environment Variable (CWE-526) in Elastic Cloud on Kubernetes (ECK) can lead to information disclosure via Retrieve Embedded Sensitive Data (CAPEC-37). When ECK reconciles a Fleet Server resource that authenticates to Elasticsearch with a service account token, the token is written into the generated workload specification in cleartext rather than being referenced from the Kubernetes Secret that ECK maintains for the other credentials on the same path. Any principal able to read workload specifications in the affected namespace can therefore read a live Elasticsearch credential, even when Kubernetes RBAC does not grant that principal access to Secrets.&#34;, &#34;reference_url&#34;: &#34;https://discuss.elastic.co/t/elastic-cloud-on-kubernetes-3-5-0-security-update-esa-2026-113/389493&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260815211214&#34;, &#34;collected_at&#34;: &#34;20260815211219&#34;, &#34;content_hash&#34;: &#34;0430eedaa0364ac7727f3255a584f7d566105cae251f874fc88384bb9e2af816&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-72656&#34;, &#34;sw_name&#34;: &#34;Elasticsearch&#34;, &#34;vendor&#34;: &#34;Elastic&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;MEDIUM&#34;, &#34;cvss_score&#34;: 6.5, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:N/A:H&#34;, &#34;published_date&#34;: &#34;20260813&#34;, &#34;modified_date&#34;: &#34;20260813&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] Memory Allocation with Excessive Size Value (CWE-789) in the ES|QL query processing of Elasticsearch can lead to denial of service via Excessive Allocation (CAPEC-130). An authenticated user able to submit ES|QL queries could send a specially crafted query whose evaluation allocates an unbounded amount of heap memory, exhausting the available heap on the receiving node and causing the node to become unavailable.&#34;, &#34;reference_url&#34;: &#34;https://discuss.elastic.co/t/elasticsearch-8-18-0-9-0-0-security-update-esa-2026-111/389495&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260815211214&#34;, &#34;collected_at&#34;: &#34;20260815211219&#34;, &#34;content_hash&#34;: &#34;27c688da04d2f63c2be3ed203563f2b2f74c922b880f089e68369c1bb462788e&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-72661&#34;, &#34;sw_name&#34;: &#34;Elasticsearch&#34;, &#34;vendor&#34;: &#34;Elastic&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;MEDIUM&#34;, &#34;cvss_score&#34;: 6.5, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:N&#34;, &#34;published_date&#34;: &#34;20260813&#34;, &#34;modified_date&#34;: &#34;20260813&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] Missing Authorization (CWE-862) in Kibana can lead to information disclosure via Accessing Functionality Not Properly Constrained by ACLs (CAPEC-1). An internal Kibana data retrieval capability used by Elastic Defend endpoint response actions did not enforce the Security Solution and endpoint privileges that its user-facing equivalents require, and it retrieved data with elevated internal permissions rather than the permissions of the requesting user. As a result, an authenticated low-privileged Kibana user with no Security Solution privileges, endpoint privileges and no Elasticsearch privileges on the underlying data, could read endpoint response action records and the corresponding response content returned by managed hosts.&#34;, &#34;reference_url&#34;: &#34;https://discuss.elastic.co/t/kibana-8-19-19-9-3-8-9-4-4-security-update-esa-2026-102/389513&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260815211214&#34;, &#34;collected_at&#34;: &#34;20260815211219&#34;, &#34;content_hash&#34;: &#34;567a25cf79ddfc671b33578e98f50dc19da3dcd837c924255260278870b99efa&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-72678&#34;, &#34;sw_name&#34;: &#34;Elasticsearch&#34;, &#34;vendor&#34;: &#34;Elastic&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;MEDIUM&#34;, &#34;cvss_score&#34;: 6.5, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:N/A:H&#34;, &#34;published_date&#34;: &#34;20260813&#34;, &#34;modified_date&#34;: &#34;20260813&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] Elasticsearch does not validate a size value taken from a user-supplied input before that value is used to reserve memory for an internal data structure. An authenticated user holding only read privileges can submit a single small crafted request to a product API endpoint that causes the node to attempt an excessively large allocation. The resulting memory exhaustion raises a fatal error that terminates the Elasticsearch node process, causing a denial of service for the affected node and degrading cluster health. The defect is not volumetric, so a single request is sufficient regardless of the heap size configured on the target node.&#34;, &#34;reference_url&#34;: &#34;https://discuss.elastic.co/t/elasticsearch-8-19-20-9-4-5-9-5-1-security-update-esa-2026-80/389507&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260815211214&#34;, &#34;collected_at&#34;: &#34;20260815211219&#34;, &#34;content_hash&#34;: &#34;ce400f7643683743221160c12b72ce834fca5156a18a58459f0611ee99dc717e&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-72679&#34;, &#34;sw_name&#34;: &#34;Elasticsearch&#34;, &#34;vendor&#34;: &#34;Elastic&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;MEDIUM&#34;, &#34;cvss_score&#34;: 6.5, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:N/A:H&#34;, &#34;published_date&#34;: &#34;20260813&#34;, &#34;modified_date&#34;: &#34;20260813&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] Elasticsearch does not apply its configurable input length restriction to a user-supplied pattern accepted by an intervals query. Compiling a deeply nested pattern drives unbounded recursion that exhausts the thread stack and raises a fatal error, terminating the Elasticsearch node process and causing a denial of service for that node. An authenticated user holding only read-only privileges on a single searchable index can trigger the condition with one small search request.&#34;, &#34;reference_url&#34;: &#34;https://discuss.elastic.co/t/elasticsearch-8-19-20-9-4-5-security-update-esa-2026-81/389501&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260815211214&#34;, &#34;collected_at&#34;: &#34;20260815211219&#34;, &#34;content_hash&#34;: &#34;57a3afa82f10843ee98a31830353e69238754a3251db13b82d424f99345bee14&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-72683&#34;, &#34;sw_name&#34;: &#34;Elasticsearch&#34;, &#34;vendor&#34;: &#34;Elastic&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;MEDIUM&#34;, &#34;cvss_score&#34;: 6.5, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:N/A:H&#34;, &#34;published_date&#34;: &#34;20260813&#34;, &#34;modified_date&#34;: &#34;20260813&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] A flaw in Elasticsearch allows an authenticated user with the privileges required to invoke the simulate pipeline API endpoint (https://www.elastic.co/docs/api/doc/elasticsearch/operation/operation-ingest-simulate) to submit a request that causes a self-referential data structure to be created. When a specific internal component later processes that structure, the operation recurses without bound and raises a fatal error that is not handled by the surrounding execution path, terminating the affected node process and resulting in a denial of service.&#34;, &#34;reference_url&#34;: &#34;https://discuss.elastic.co/t/elasticsearch-8-19-19-9-3-8-9-4-4-security-update-esa-2026-75/389496&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260815211214&#34;, &#34;collected_at&#34;: &#34;20260815211219&#34;, &#34;content_hash&#34;: &#34;11050ec74455e801e506c3edc5320879f4a4ceb81967bbae582cae9fedd4f9f2&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-72684&#34;, &#34;sw_name&#34;: &#34;Elasticsearch&#34;, &#34;vendor&#34;: &#34;Elastic&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;MEDIUM&#34;, &#34;cvss_score&#34;: 6.5, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:N/A:H&#34;, &#34;published_date&#34;: &#34;20260813&#34;, &#34;modified_date&#34;: &#34;20260813&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] A flaw in Elasticsearch allows an authenticated user holding only read privileges to submit a small search request containing a crafted user-supplied input. Processing that input causes a specific internal component to allocate memory without any upper bound, and the allocation occurs outside the scope of the existing memory accounting controls that were intended to constrain it. The resulting out-of-memory condition is fatal and terminates the affected node process, causing a denial of service.&#34;, &#34;reference_url&#34;: &#34;https://discuss.elastic.co/t/elasticsearch-8-19-20-9-4-5-security-update-esa-2026-76/389508&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260815211214&#34;, &#34;collected_at&#34;: &#34;20260815211219&#34;, &#34;content_hash&#34;: &#34;4821fe7ad14c29dca9c8907364597535ce2a971e1ae9c0ffcf3b0086bb20f1ca&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-72686&#34;, &#34;sw_name&#34;: &#34;Elasticsearch&#34;, &#34;vendor&#34;: &#34;Elastic&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;MEDIUM&#34;, &#34;cvss_score&#34;: 6.5, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:N/A:H&#34;, &#34;published_date&#34;: &#34;20260813&#34;, &#34;modified_date&#34;: &#34;20260813&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] A flaw in Elasticsearch allows a low-privileged authenticated user to submit a single request containing a crafted user-supplied input. A specific internal component validates the input using a recursive routine and applies no bound to the length of the value being validated, so the validation causes the thread to exhaust its stack. The resulting fatal error is not handled by the surrounding execution paths and terminates the affected node process, producing a denial of service.&#34;, &#34;reference_url&#34;: &#34;https://discuss.elastic.co/t/elasticsearch-8-19-20-9-4-5-9-5-1-security-update-esa-2026-78/389505&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260815211214&#34;, &#34;collected_at&#34;: &#34;20260815211219&#34;, &#34;content_hash&#34;: &#34;b8a5a84135ebf5f6df6c89bcae6efe6f4cc48144e5074bdb3007d7d2ea661c10&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-72687&#34;, &#34;sw_name&#34;: &#34;Elasticsearch&#34;, &#34;vendor&#34;: &#34;Elastic&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;MEDIUM&#34;, &#34;cvss_score&#34;: 6.5, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:N/A:H&#34;, &#34;published_date&#34;: &#34;20260813&#34;, &#34;modified_date&#34;: &#34;20260813&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] A flaw in Elasticsearch allows a low-privileged authenticated user to submit a single small request containing a forged opaque identifier. Elasticsearch decodes and deserializes the identifier before confirming that it was legitimately issued by the cluster, and a size value carried inside the identifier drives an allocation that is neither capped nor accounted for by the available memory-usage controls. The resulting out-of-memory condition is fatal and terminates the affected node process, resulting in a denial of service.&#34;, &#34;reference_url&#34;: &#34;https://discuss.elastic.co/t/elasticsearch-8-19-20-9-4-5-9-5-1-security-update-esa-2026-79/389506&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260815211214&#34;, &#34;collected_at&#34;: &#34;20260815211219&#34;, &#34;content_hash&#34;: &#34;d8ad8b5e25c88cc9ab6f59c417043de58710e565281a692ad1ca22282c410e4b&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-54007&#34;, &#34;sw_name&#34;: &#34;Open WebUI&#34;, &#34;vendor&#34;: &#34;Open WebUI&#34;, &#34;affected_range&#34;: &#34;&lt;=0.9.5&#34;, &#34;fixed_version&#34;: &#34;0.9.6&#34;, &#34;severity&#34;: &#34;MEDIUM&#34;, &#34;cvss_score&#34;: 6.5, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:N&#34;, &#34;published_date&#34;: &#34;20260617&#34;, &#34;modified_date&#34;: &#34;20260813&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;Open WebUI: Cross-origin postMessage confirmation bypass via action:submit ### Summary The chat message listener allows non-same-origin `input:prompt` and `action:submit` messages, so an external site can set prompt text and trigger `submitPrompt()` in an authenticated victim session. I validated this with a cross-origin attacker page that auto-posted messages and caused unauthorized `POST /api/v1/chats/new` and `POST /api/chat/completions` requests containing attacker-controlled prompts. This enables cross-site forced actions and model/tool execution under victim privileges without consent. ### Details The chat page&#39;s window message listener in `src/lib/components/chat/Chat.svelte` processes message types including `input:prompt` and `action:submit` without adequately enforcing same-origin restrictions. Based on code around lines ~597-616, input text is set directly from `event.data.text`; `action:submit` proceeds to `submitPrompt()` on the current prompt. The logic does not apply a s&#34;, &#34;reference_url&#34;: &#34;https://github.com/advisories/GHSA-3vv5-8xxp-4f55&#34;, &#34;source&#34;: &#34;GHSA&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260815211214&#34;, &#34;collected_at&#34;: &#34;20260815211306&#34;, &#34;content_hash&#34;: &#34;efbcc96ec53827b1775cb7f441ca8bd8eeacb82db09e1759eea8f6557eda9ec4&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-14548&#34;, &#34;sw_name&#34;: &#34;Ray&#34;, &#34;vendor&#34;: &#34;Anyscale&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;MEDIUM&#34;, &#34;cvss_score&#34;: 6.5, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:N&#34;, &#34;published_date&#34;: &#34;20260811&#34;, &#34;modified_date&#34;: &#34;20260812&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] The Ray Enterprise Translation WordPress plugin through 1.7.3 does not perform any capability or nonce checks on one of its AJAX actions, allowing any authenticated user, including Subscribers, to overwrite the administrator-configured translation API token with an arbitrary value.&#34;, &#34;reference_url&#34;: &#34;https://wpscan.com/vulnerability/e1e0e945-db49-4e27-b143-ef3520a39db9/&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260814211606&#34;, &#34;collected_at&#34;: &#34;20260814211613&#34;, &#34;content_hash&#34;: &#34;4d07872ba2bd6b71ef4cc3764696a1a94f6faab2ac88483d83098d44fec6b84f&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-73559&#34;, &#34;sw_name&#34;: &#34;vLLM&#34;, &#34;vendor&#34;: &#34;vLLM Project&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;MEDIUM&#34;, &#34;cvss_score&#34;: 6.5, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:N/A:H&#34;, &#34;published_date&#34;: &#34;20260813&#34;, &#34;modified_date&#34;: &#34;20260814&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] vLLM is an inference and serving engine for large language models. From 0.19.0 until 0.26.0, the /v1/completions CompletionRequest.prompt field in vllm/entrypoints/openai/completion/protocol.py accepts an unbounded list[str] or list[list[int]], prompt_to_seq() in vllm/renderers/inputs/preprocess.py and OnlineRenderer.preprocess_completion() in vllm/renderers/online_renderer.py expand every element, and vllm/entrypoints/openai/completion/serving.py creates one engine generator and response slot per prompt, allowing an authenticated API client to exhaust CPU, memory, async scheduling capacity, engine request slots, and response buffering with one request. This issue is fixed in version 0.26.0.&#34;, &#34;reference_url&#34;: &#34;https://github.com/vllm-project/vllm/commit/675f4295cdfe0d870471c2b51bfeca3a68a9569e&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260816211121&#34;, &#34;collected_at&#34;: &#34;20260816211125&#34;, &#34;content_hash&#34;: &#34;4f2a910506a80148e0643b3c364baa265d9083095c53f5a9763c885afd8e5e9b&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-18632&#34;, &#34;sw_name&#34;: &#34;Dify&#34;, &#34;vendor&#34;: &#34;LangGenius&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;MEDIUM&#34;, &#34;cvss_score&#34;: 6.3, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:L/I:L/A:L&#34;, &#34;published_date&#34;: &#34;20260803&#34;, &#34;modified_date&#34;: &#34;20260812&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] A security flaw has been discovered in langgenius dify up to 1.14.2. This issue affects the function jinja2.Template of the file api/core/helper/code_executor/jinja2/jinja2_transformer.py of the component Jinja2 Handler. The manipulation results in improper neutralization of special elements used in a template engine. The attack may be launched remotely. The exploit has been released to the public and may be used for attacks. The vendor was contacted early about this disclosure but did not respond in any way.&#34;, &#34;reference_url&#34;: &#34;https://github.com/CVE-Hunter-Leo/CVE/issues/14&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;github&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260814211606&#34;, &#34;collected_at&#34;: &#34;20260814211613&#34;, &#34;content_hash&#34;: &#34;7e6fe03f73d8656542a88dec3f2184b5730fa661189be1e83128e24a42396fbf&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-19918&#34;, &#34;sw_name&#34;: &#34;gRPC&#34;, &#34;vendor&#34;: &#34;gRPC Authors&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;MEDIUM&#34;, &#34;cvss_score&#34;: 6.3, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:L&#34;, &#34;published_date&#34;: &#34;20260816&#34;, &#34;modified_date&#34;: &#34;20260816&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] A vulnerability has been found in SpaceX Starlink Router Gen 3 2025.11.14.mr64708.3. This affects the function get_status of the component gRPC Management Interface. The manipulation leads to improper access controls. The attack can only be initiated within the local network. The exploit has been disclosed to the public and may be used. The vendor was contacted early about this disclosure but did not respond in any way.&#34;, &#34;reference_url&#34;: &#34;https://vuldb.com/cve/CVE-2026-19918&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260816211121&#34;, &#34;last_seen_run&
