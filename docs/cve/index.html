;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;MEDIUM&#34;, &#34;cvss_score&#34;: 6.1, &#34;cvss_vector&#34;: &#34;CVSS:4.0/AV:N/AC:L/AT:P/PR:L/UI:N/VC:L/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X&#34;, &#34;published_date&#34;: &#34;20260813&#34;, &#34;modified_date&#34;: &#34;20260813&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] jupyterlab is an extensible environment for interactive and reproducible computing, based on the Jupyter Notebook Architecture. From 4.5.0 until 4.5.10 and 4.6.2, in jupyterlab/extensions/manager.py and jupyterlab/extensions/pypi.py, JupyterLab&#39;s PyPI extension manager enforces blocked_extensions_uris by comparing requested install names to blocklist entries with custom normalization that is weaker than PyPI package-name canonicalization. An authenticated user can request a PyPI-equivalent spelling such as JupyterLab.Git for a blocklisted package such as jupyterlab-git, and JupyterLab accepts the install request even though pip resolves the variant to the same package. Security impact requires an allowlist or blocklist intended to restrict package installation, the PyPI Extension Manager, and kernels and terminals that are disabled or delegated to remote hosts. The bypass lets an authenticated user install a prohibited extension, defeat integrity restrictions, and affect ava&#34;, &#34;reference_url&#34;: &#34;https://github.com/jupyterlab/jupyterlab/commit/9365f020baec5221deaf11535ed554c06637c999&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260815211214&#34;, &#34;collected_at&#34;: &#34;20260815211219&#34;, &#34;content_hash&#34;: &#34;b4505d2b5d374211f9d6fbd8e4fc95260af563ea6048ed469c297def6aaf58ca&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-73416&#34;, &#34;sw_name&#34;: &#34;JupyterLab&#34;, &#34;vendor&#34;: &#34;Project Jupyter&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;MEDIUM&#34;, &#34;cvss_score&#34;: 6.1, &#34;cvss_vector&#34;: &#34;CVSS:4.0/AV:N/AC:L/AT:P/PR:L/UI:N/VC:L/VI:H/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X&#34;, &#34;published_date&#34;: &#34;20260813&#34;, &#34;modified_date&#34;: &#34;20260813&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] jupyterlab is an extensible environment for interactive and reproducible computing, based on the Jupyter Notebook Architecture. From 4.5.0 until 4.5.10 and 4.6.2, in jupyterlab/extensions/manager.py and jupyterlab/extensions/pypi.py, JupyterLab&#39;s PyPI extension manager enforces blocked_extensions_uris by comparing requested install names to blocklist entries with custom normalization that is weaker than PyPI package-name canonicalization. An authenticated user can request a PyPI-equivalent spelling such as JupyterLab.Git for a blocklisted package such as jupyterlab-git, and JupyterLab accepts the install request even though pip resolves the variant to the same package. Security impact requires an allowlist or blocklist intended to restrict package installation, the PyPI Extension Manager, and kernels and terminals that are disabled or delegated to remote hosts. The bypass lets an authenticated user install a prohibited extension, defeat integrity restrictions, and affect ava&#34;, &#34;reference_url&#34;: &#34;https://github.com/jupyterlab/jupyterlab/commit/9365f020baec5221deaf11535ed554c06637c999&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260815211214&#34;, &#34;collected_at&#34;: &#34;20260815211219&#34;, &#34;content_hash&#34;: &#34;b4505d2b5d374211f9d6fbd8e4fc95260af563ea6048ed469c297def6aaf58ca&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-73627&#34;, &#34;sw_name&#34;: &#34;JupyterLab&#34;, &#34;vendor&#34;: &#34;Project Jupyter&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;MEDIUM&#34;, &#34;cvss_score&#34;: 6.0, &#34;cvss_vector&#34;: &#34;CVSS:4.0/AV:N/AC:L/AT:P/PR:L/UI:N/VC:L/VI:H/VA:N/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X&#34;, &#34;published_date&#34;: &#34;20260813&#34;, &#34;modified_date&#34;: &#34;20260815&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] JupyterLab (pip package &#39;jupyterlab&#39;) versions &gt;=4.1.0,&lt;=4.5.9 and &gt;=4.6.0,&lt;=4.6.1 contain a plugin manager lock-rule enforcement bypass. Two server-side enforcement gaps allow an authenticated user to circumvent administrator lock rules by making direct requests to the /lab/api/plugins endpoint, enabling or disabling plugins that were locked — including child plugins of multi-plugin extensions and plugins locked via the &#39;lock all&#39; mechanism. This can impact data integrity and bypass hardening or restrictions (e.g., download/upload limits) implemented through locked plugins. Fixed in versions 4.6.2 and 4.5.10.&#34;, &#34;reference_url&#34;: &#34;https://github.com/jupyterlab/jupyterlab/security/advisories/GHSA-h5v5-8746-g7mm&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260816211121&#34;, &#34;collected_at&#34;: &#34;20260816211125&#34;, &#34;content_hash&#34;: &#34;d8014b35a3caf41caf5116d96bf616d2ec7a81482ad6866b86b2a543dc71ada4&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-72917&#34;, &#34;sw_name&#34;: &#34;AnythingLLM&#34;, &#34;vendor&#34;: &#34;Mintplex Labs&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;MEDIUM&#34;, &#34;cvss_score&#34;: 5.9, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:N/A:N&#34;, &#34;published_date&#34;: &#34;20260810&#34;, &#34;modified_date&#34;: &#34;20260812&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] AnythingLLM is an application that turns pieces of content into context that any LLM can use as references during chatting. From 1.0.0 to 1.15.0, AnythingLLM&#39;s unauthenticated account-recovery flow in server/utils/PasswordRecovery/index.js uses recoverAccount() to deduplicate the raw recoveryCodes values before trimming them, so one valid code submitted twice with different surrounding whitespace can satisfy the two-code check. Each normalized value can also match the same stored hash instead of consuming a distinct hash. An attacker who knows the target username and one recovery code can call POST /api/system/recover-account in multi-user mode, receive a password-reset token, and use POST /api/system/reset-password to take over the account, including an administrator account.&#34;, &#34;reference_url&#34;: &#34;https://github.com/Mintplex-Labs/anything-llm/commit/61766d06b77b903f66dc4afd8dffb3a39012db14&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;github&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260814211606&#34;, &#34;collected_at&#34;: &#34;20260814211613&#34;, &#34;content_hash&#34;: &#34;59f6693c280c3bab09cf3f60e7c879f5adaac33f654dc94220b54c1bb7c44bfb&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-59242&#34;, &#34;sw_name&#34;: &#34;Airflow&#34;, &#34;vendor&#34;: &#34;apache&#34;, &#34;affected_range&#34;: &#34;&lt;3.3.1&#34;, &#34;fixed_version&#34;: &#34;3.3.1&#34;, &#34;severity&#34;: &#34;MEDIUM&#34;, &#34;cvss_score&#34;: 5.4, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:L/I:L/A:N&#34;, &#34;published_date&#34;: &#34;20260812&#34;, &#34;modified_date&#34;: &#34;20260814&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;Apache Airflow&#39;s XCom `GET /api/v2/{...}/xcomEntries/{key}?deserialize=true` endpoint passed a string-literal payload through `BaseXCom.deserialize_value` without the `_check_forbidden_xcom_keys` guard, allowing an authenticated API user with XCom write-and-read access to instantiate arbitrary `airflow.*` classes on the API server (CWE-502). An authenticated user who can write an XCom value and then read it back with `deserialize=true` triggers the unsafe instantiation. Users are advised to upgrade to apache-airflow 3.3.1 or later, which rejects reserved XCom serialization keys submitted as JSON string literals.&#34;, &#34;reference_url&#34;: &#34;https://github.com/apache/airflow/pull/69378&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260816211121&#34;, &#34;collected_at&#34;: &#34;20260816211125&#34;, &#34;content_hash&#34;: &#34;2190da810d91f58b43804a2f84d46a452d81bb997ea0d4bcafc8aa60606f73d4&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-68076&#34;, &#34;sw_name&#34;: &#34;Airflow&#34;, &#34;vendor&#34;: &#34;apache&#34;, &#34;affected_range&#34;: &#34;&lt;3.3.1&#34;, &#34;fixed_version&#34;: &#34;3.3.1&#34;, &#34;severity&#34;: &#34;MEDIUM&#34;, &#34;cvss_score&#34;: 5.4, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:L/I:N/A:L&#34;, &#34;published_date&#34;: &#34;20260812&#34;, &#34;modified_date&#34;: &#34;20260814&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;Apache Airflow&#39;s environment-variable secrets backend resolved a team-scoped Connection or Variable from the wrong team&#39;s scope. The guard meant to prevent this only ran when no team scope was supplied, and its pattern could not match a team name containing an underscore, which team names are allowed to contain. When the guard did not apply, the lookup fell through to an unconditional global read that resolved the stored `AIRFLOW_CONN__&lt;TEAM&gt;___&lt;ID&gt;` variable regardless of which team asked. In multi-team mode an authenticated user of one team could therefore have `POST /api/v2/connections/test` resolve another team&#39;s Connection and authenticate outward with that team&#39;s credentials; the endpoint uses the credentials rather than returning them. Exploitation requires `[core] multi_team` enabled, `[core] test_connection` set to `Enabled` (it ships `Disabled`), team-scoped secrets provisioned as environment variables in the API-server process, and knowledge of the encoded identifier. Redire&#34;, &#34;reference_url&#34;: &#34;https://github.com/apache/airflow/pull/70736&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260816211121&#34;, &#34;collected_at&#34;: &#34;20260816211125&#34;, &#34;content_hash&#34;: &#34;11ef680d8f537041daf38e1cc0276d376f30c75f9466d7bcbdc49cb4ebd9de8e&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-21387&#34;, &#34;sw_name&#34;: &#34;PyTorch&#34;, &#34;vendor&#34;: &#34;PyTorch Foundation&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;MEDIUM&#34;, &#34;cvss_score&#34;: 5.4, &#34;cvss_vector&#34;: &#34;CVSS:4.0/AV:L/AC:L/AT:P/PR:H/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X&#34;, &#34;published_date&#34;: &#34;20260811&#34;, &#34;modified_date&#34;: &#34;20260812&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] Protection mechanism failure for some Intel(R) LLM Library for PyTorch within Ring 3: User Applications may allow an escalation of privilege. Unprivileged software adversary with a privileged user combined with a low complexity attack may enable escalation of privilege. This result may potentially occur via local access when attack requirements are present without special internal knowledge and requires passive user interaction. The potential vulnerability may impact the confidentiality (high), integrity (high) and availability (high) of the vulnerable system, resulting in subsequent system confidentiality (none), integrity (none) and availability (none) impacts.&#34;, &#34;reference_url&#34;: &#34;https://intel.com/content/www/us/en/security-center/advisory/intel-sa-01465.html&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260814211606&#34;, &#34;collected_at&#34;: &#34;20260814211613&#34;, &#34;content_hash&#34;: &#34;fda47e8e2c2e72e514bc690df76b78a4823ebdf2da46d2c844bd5fb68c289106&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-24693&#34;, &#34;sw_name&#34;: &#34;PyTorch&#34;, &#34;vendor&#34;: &#34;PyTorch Foundation&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;MEDIUM&#34;, &#34;cvss_score&#34;: 5.4, &#34;cvss_vector&#34;: &#34;CVSS:4.0/AV:L/AC:L/AT:P/PR:H/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X&#34;, &#34;published_date&#34;: &#34;20260811&#34;, &#34;modified_date&#34;: &#34;20260812&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] Protection mechanism failure for some Intel(R) oneCCL Bindings for PyTorch before version v2.8.0 within Ring 3: User Applications may allow an escalation of privilege. Unprivileged software adversary with a privileged user combined with a low complexity attack may enable escalation of privilege. This result may potentially occur via local access when attack requirements are present without special internal knowledge and requires passive user interaction. The potential vulnerability may impact the confidentiality (high), integrity (high) and availability (high) of the vulnerable system, resulting in subsequent system confidentiality (none), integrity (none) and availability (none) impacts.&#34;, &#34;reference_url&#34;: &#34;https://intel.com/content/www/us/en/security-center/advisory/intel-sa-01464.html&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260814211606&#34;, &#34;collected_at&#34;: &#34;20260814211613&#34;, &#34;content_hash&#34;: &#34;53140a8954773cde00cdc27791527d7b15903517442a15b36b6bfacd9c28f36b&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-20728&#34;, &#34;sw_name&#34;: &#34;TensorFlow&#34;, &#34;vendor&#34;: &#34;Google&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;MEDIUM&#34;, &#34;cvss_score&#34;: 5.4, &#34;cvss_vector&#34;: &#34;CVSS:4.0/AV:L/AC:L/AT:P/PR:H/UI:P/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X&#34;, &#34;published_date&#34;: &#34;20260811&#34;, &#34;modified_date&#34;: &#34;20260812&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] Protection mechanism failure for some Intel Extension for TensorFlow software before version 2.15.0.3 within Ring 3: User Applications may allow an escalation of privilege. System software adversary with a privileged user combined with a low complexity attack may enable escalation of privilege. This result may potentially occur via local access when attack requirements are present without special internal knowledge and requires passive user interaction. The potential vulnerability may impact the confidentiality (high), integrity (high) and availability (high) of the vulnerable system, resulting in subsequent system confidentiality (none), integrity (none) and availability (none) impacts.&#34;, &#34;reference_url&#34;: &#34;https://intel.com/content/www/us/en/security-center/advisory/intel-sa-01458.html&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260814211606&#34;, &#34;collected_at&#34;: &#34;20260814211613&#34;, &#34;content_hash&#34;: &#34;221effbf55b882f036f7e418729929b45f89457556c68d1eddc38b943ca520f8&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-68870&#34;, &#34;sw_name&#34;: &#34;Airflow&#34;, &#34;vendor&#34;: &#34;Apache Software Foundation&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;MEDIUM&#34;, &#34;cvss_score&#34;: 5.3, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:U/C:H/I:N/A:N&#34;, &#34;published_date&#34;: &#34;20260810&#34;, &#34;modified_date&#34;: &#34;20260812&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] The Azure Key Vault secrets backend in Apache Airflow&#39;s Microsoft Azure provider resolved a team-scoped Connection or Variable id through the team-agnostic lookup when the team-scoped lookup missed. In a deployment running multi-team mode with this backend, a caller in one team could resolve a secret belonging to another team by supplying an id that spells out that team&#39;s namespace, obtaining its credentials in full. No unusual configuration is required beyond enabling multi-team mode and using this backend. Users are advised to upgrade to apache-airflow-providers-microsoft-azure 14.1.0 or later, which refuses the team-agnostic fall-through for an id that could name a team namespace.&#34;, &#34;reference_url&#34;: &#34;https://github.com/apache/airflow/pull/70876&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260814211606&#34;, &#34;collected_at&#34;: &#34;20260814211613&#34;, &#34;content_hash&#34;: &#34;39d5ed5a021d99c58849fb5c65c13d60a64bea07b7c7046f7142815cbc1f0d17&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-73555&#34;, &#34;sw_name&#34;: &#34;FastAPI&#34;, &#34;vendor&#34;: &#34;FastAPI&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;MEDIUM&#34;, &#34;cvss_score&#34;: 5.3, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N&#34;, &#34;published_date&#34;: &#34;20260813&#34;, &#34;modified_date&#34;: &#34;20260814&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] vLLM is an inference and serving engine for large language models. Prior to 0.26.0, the validation_exception_handler in vllm/entrypoints/openai/server_utils.py converts FastAPI RequestValidationError objects with str(exc), and sanitize_message in vllm/entrypoints/utils.py does not remove traceback-style file paths, allowing unauthenticated malformed JSON requests to /v1/chat/completions, /v1/completions, /tokenize, and /detokenize to disclose the OS username, home and virtual-environment paths, Python version, internal package structure, line numbers, and endpoint handler names. This issue is fixed in version 0.26.0.&#34;, &#34;reference_url&#34;: &#34;https://github.com/vllm-project/vllm/commit/e87521626febe2763f997691d1599de4175f4324&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260816211121&#34;, &#34;collected_at&#34;: &#34;20260816211125&#34;, &#34;content_hash&#34;: &#34;428293af8e873b88a03e7fa4b3c029750cb56af1ae8ee2f1c32862ad72749832&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-19334&#34;, &#34;sw_name&#34;: &#34;Ollama&#34;, &#34;vendor&#34;: &#34;Ollama&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;MEDIUM&#34;, &#34;cvss_score&#34;: 5.3, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:L/I:L/A:L&#34;, &#34;published_date&#34;: &#34;20260809&#34;, &#34;modified_date&#34;: &#34;20260812&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] A flaw has been found in NightTrek Ollama-mcp up to 80cf2e17cfc144963a475b619093a2d13c13dbc9. This affects an unknown part of the file src/index.ts. This manipulation of the argument name/modelfile/source/destination causes command injection. The attack can only be executed locally. This product is using a rolling release to provide continious delivery. Therefore, no version details for affected nor updated releases are available. The project was informed of the problem early through an issue report but has not responded yet.&#34;, &#34;reference_url&#34;: &#34;https://github.com/NightTrek/Ollama-mcp/&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;github&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260814211606&#34;, &#34;collected_at&#34;: &#34;20260814211613&#34;, &#34;content_hash&#34;: &#34;6711b4677aa9de3d940b455cc99a4f1cddf4e6eb772de1f1907c39f88a3ed7a8&#34;}, {&#34;cve_id&#34;: &#34;CVE-2024-12720&#34;, &#34;sw_name&#34;: &#34;Transformers&#34;, &#34;vendor&#34;: &#34;Hugging Face&#34;, &#34;affected_range&#34;: &#34;&lt;4.48.0&#34;, &#34;fixed_version&#34;: &#34;4.48.0&#34;, &#34;severity&#34;: &#34;MEDIUM&#34;, &#34;cvss_score&#34;: 5.3, &#34;cvss_vector&#34;: &#34;CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:L&#34;, &#34;published_date&#34;: &#34;20250320&#34;, &#34;modified_date&#34;: &#34;20260813&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;A Regular Expression Denial of Service (ReDoS) vulnerability was identified in the huggingface/transformers library, specifically in the file tokenization_nougat_fast.py. The vulnerability occurs in the post_process_single() function, where a regular expression processes specially crafted input. The issue stems from the regex exhibiting exponential time complexity under certain conditions, leading to excessive backtracking. This can result in significantly high CPU usage and potential application downtime, effectively creating a Denial of Service (DoS) scenario. The affected version is v4.46.3.&#34;, &#34;reference_url&#34;: &#34;https://nvd.nist.gov/vuln/detail/CVE-2024-12720&#34;, &#34;source&#34;: &#34;OSV&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260815211214&#34;, &#34;collected_at&#34;: &#34;20260815211215&#34;, &#34;content_hash&#34;: &#34;16cd995e6217264c6b6abf1a9d6bf5bd3251ff53b4f6468f3c2d7fbc958f73bc&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-18675&#34;, &#34;sw_name&#34;: &#34;gRPC&#34;, &#34;vendor&#34;: &#34;gRPC Authors&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;MEDIUM&#34;, &#34;cvss_score&#34;: 5.3, &#34;cvss_vector&#34;: &#34;CVSS:4.0/AV:A/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X&#34;, &#34;published_date&#34;: &#34;20260812&#34;, &#34;modified_date&#34;: &#34;20260813&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] The dataplane token validator in kuma-cp performs an unchecked Go type assertion on the JWT kid header. A token whose kid is a JSON number decodes as a float64 and triggers a runtime panic before any signature, claims, or authorization check runs. The panic terminates the entire kuma-cp process, HTTP API, the health and readiness endpoints, and xDS. Unauthenticated access to the dataplane gRPC server can trigger the crash with a malformed token A single request is a transient interruption; sustaining an outage requires repeated requests.&#34;, &#34;reference_url&#34;: &#34;https://developer.konghq.com/mesh/changelog/&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260815211214&#34;, &#34;collected_at&#34;: &#34;20260815211219&#34;, &#34;content_hash&#34;: &#34;444ef8f2df20474999046e5701b30fab41e83823199f8bcf108a9f103da4c8f2&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-72750&#34;, &#34;sw_name&#34;: &#34;n8n&#34;, &#34;vendor&#34;: &#34;n8n GmbH&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;MEDIUM&#34;, &#34;cvss_score&#34;: 5.3, &#34;cvss_vector&#34;: &#34;CVSS:4.0/AV:N/AC:L/AT:P/PR:L/UI:N/VC:L/VI:L/VA:N/SC:H/SI:H/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X&#34;, &#34;published_date&#34;: &#34;20260811&#34;, &#34;modified_date&#34;: &#34;20260814&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] n8n before 1.123.67, 2.31.5, and 2.32.1 contains a SQL injection vulnerability in the Snowflake node&#39;s Execute Query operation, which interpolates expression values directly into the SQL string. When a workflow author embeds untrusted, externally-controlled expression data directly in a raw SQL query, that data is not parameterized, allowing SQL injection. The fix adds an optional &#39;Query Parameters&#39; field to bind values via positional placeholders.&#34;, &#34;reference_url&#34;: &#34;https://github.com/n8n-io/n8n/security/advisories/GHSA-652q-gvq3-74qv&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;npm&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260816211121&#34;, &#34;collected_at&#34;: &#34;20260816211125&#34;, &#34;content_hash&#34;: &#34;9efd275fbd8cddc7c83f2cca923b9323ea990c7c0c04b21bf151d80ec24bc2fe&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-73555&#34;, &#34;sw_name&#34;: &#34;vLLM&#34;, &#34;vendor&#34;: &#34;vLLM Project&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;MEDIUM&#34;, &#34;cvss_score&#34;: 5.3, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N&#34;, &#34;published_date&#34;: &#34;20260813&#34;, &#34;modified_date&#34;: &#34;20260814&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] vLLM is an inference and serving engine for large language models. Prior to 0.26.0, the validation_exception_handler in vllm/entrypoints/openai/server_utils.py converts FastAPI RequestValidationError objects with str(exc), and sanitize_message in vllm/entrypoints/utils.py does not remove traceback-style file paths, allowing unauthenticated malformed JSON requests to /v1/chat/completions, /v1/completions, /tokenize, and /detokenize to disclose the OS username, home and virtual-environment paths, Python version, internal package structure, line numbers, and endpoint handler names. This issue is fixed in version 0.26.0.&#34;, &#34;reference_url&#34;: &#34;https://github.com/vllm-project/vllm/commit/e87521626febe2763f997691d1599de4175f4324&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260816211121&#34;, &#34;collected_at&#34;: &#34;20260816211125&#34;, &#34;content_hash&#34;: &#34;428293af8e873b88a03e7fa4b3c029750cb56af1ae8ee2f1c32862ad72749832&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-73556&#34;, &#34;sw_name&#34;: &#34;vLLM&#34;, &#34;vendor&#34;: &#34;vLLM Project&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;MEDIUM&#34;, &#34;cvss_score&#34;: 5.3, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:L&#34;, &#34;published_date&#34;: &#34;20260813&#34;, &#34;modified_date&#34;: &#34;20260814&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] vLLM is an inference and serving engine for large language models. Prior to 0.26.0, the structured_outputs.regex parameter in vllm/v1/structured_output/backend_lm_format_enforcer.py is passed to lmformatenforcer.RegexParser without compile_regex_with_timeout or validation in validate_structured_output_request_lm_format_enforcer, allowing an unauthenticated /v1/completions request against the lm-format-enforcer backend to consume a CPU core and stall the structured-output engine path with a catastrophic regular expression. This issue is fixed in version 0.26.0.&#34;, &#34;reference_url&#34;: &#34;https://github.com/vllm-project/vllm/commit/c9a788eedc412acceaa5112e0d44624b49841577&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260816211121&#34;, &#34;collected_at&#34;: &#34;20260816211125&#34;, &#34;content_hash&#34;: &#34;4f228464cf77fa64cd0dcc869a87e7766cd2b638377680b9b7263b3e3cbf0202&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-73558&#34;, &#34;sw_name&#34;: &#34;vLLM&#34;, &#34;vendor&#34;: &#34;vLLM Project&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;MEDIUM&#34;, &#34;cvss_score&#34;: 5.3, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:H/PR:N/UI:R/S:U/C:H/I:N/A:N&#34;, &#34;published_date&#34;: &#34;20260813&#34;, &#34;modified_date&#34;: &#34;20260813&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] vLLM is an inference and serving engine for large language models. Prior to 0.27.0, an integer overflow in blockIdx.x * 2 * d in activation_kernels.cu can cause act_and_mul_kernel to consume another batched user&#39;s input, allowing a request processed in the same inference batch to receive a partial or complete copy of another user&#39;s inference result. This issue is fixed in version 0.27.0.&#34;, &#34;reference_url&#34;: &#34;https://github.com/vllm-project/vllm/commit/451227cb3ff07989698fed982c2d3e4300257924&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260815211214&#34;, &#34;collected_at&#34;: &#34;20260815211219&#34;, &#34;content_hash&#34;: &#34;04a8e968f82ebb8a8fc98446891fe280b9244065f5821e20d88245d3df1ce38c&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-35502&#34;, &#34;sw_name&#34;: &#34;PyTorch&#34;, &#34;vendor&#34;: &#34;PyTorch Foundation&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;MEDIUM&#34;, &#34;cvss_score&#34;: 4.6, &#34;cvss_vector&#34;: &#34;CVSS:4.0/AV:L/AC:L/AT:N/PR:N/UI:A/VC:L/VI:L/VA:L/SC:N/SI:N/SA:N/E:X/CR:X/IR:X/AR:X/MAV:X/MAC:X/MAT:X/MPR:X/MUI:X/MVC:X/MVI:X/MVA:X/MSC:X/MSI:X/MSA:X/S:X/AU:X/R:X/V:X/RE:X/U:X&#34;, &#34;published_date&#34;: &#34;20260811&#34;, &#34;modified_date&#34;: &#34;20260812&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] Deserialization of untrusted data for some Intel(R) Extension for PyTorch before version 2.8.0 within Ring 3: User Applications may allow an escalation of privilege. Unprivileged software adversary with an unauthenticated user combined with a low complexity attack may enable escalation of privilege. This result may potentially occur via local access when attack requirements are not present without special internal knowledge and requires active user interaction. The potential vulnerability may impact the confidentiality (low), integrity (low) and availability (low) of the vulnerable system, resulting in subsequent system confidentiality (none), integrity (none) and availability (none) impacts.&#34;, &#34;reference_url&#34;: &#34;https://intel.com/content/www/us/en/security-center/advisory/intel-sa-01497.html&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260814211606&#34;, &#34;collected_at&#34;: &#34;20260814211613&#34;, &#34;content_hash&#34;: &#34;f319e90153bdedb013a2dd633ff431807678181c0c1f0b9318c9e79a760b96fb&#34;}, {&#34;cve_id&#34;: &#34;CVE-2025-9266&#34;, &#34;sw_name&#34;: &#34;Accelerate&#34;, &#34;vendor&#34;: &#34;Hugging Face&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;MEDIUM&#34;, &#34;cvss_score&#34;: 4.3, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:L/A:N&#34;, &#34;published_date&#34;: &#34;20260806&#34;, &#34;modified_date&#34;: &#34;20260812&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] The Accelerate theme for WordPress is vulnerable to unauthorized modification of data due to a missing capability check on the enqueue_scripts() function in all versions up to, and including, 1.5.3. This makes it possible for authenticated attackers, with Subscriber-level access and above, to install and activate the ThemeGrill Demo Importer plugin.&#34;, &#34;reference_url&#34;: &#34;https://themes.trac.wordpress.org/changeset/283564/accelerate/1.5.4/inc/admin/class-accelerate-admin.php&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260814211606&#34;, &#34;collected_at&#34;: &#34;20260814211613&#34;, &#34;content_hash&#34;: &#34;8fd4bdaf27dee7e4994cab791eb3a568f595cd53aab3280156fe89bb7e04df23&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-54183&#34;, &#34;sw_name&#34;: &#34;Airflow&#34;, &#34;vendor&#34;: &#34;apache&#34;, &#34;affected_range&#34;: &#34;&lt;3.3.1&#34;, &#34;fixed_version&#34;: &#34;3.3.1&#34;, &#34;severity&#34;: &#34;MEDIUM&#34;, &#34;cvss_score&#34;: 4.3, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:L/I:N/A:N&#34;, &#34;published_date&#34;: &#34;20260812&#34;, &#34;modified_date&#34;: &#34;20260814&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;Apache Airflow&#39;s secrets masker hides values stored under sensitive key names when they are displayed in the UI. The masker&#39;s recursion-depth limit did not descend into values nested inside a list, tuple, or set beyond that limit, so an Airflow Variable holding such a deeply-nested value was shown unmasked in the Variables UI. The exposure is limited to the UI: any authenticated user who can see the Variable in the UI can already read its full value through the Variables REST API, so this does not disclose data the user could not otherwise obtain — the masking is a shoulder-surfing defense for the UI, not an access-control boundary. This is an incomplete-fix follow-up to CVE-2026-42358, whose fix made only the dictionary walk unbounded; lists, tuples, and sets beyond the depth limit remained unmasked in the UI. Deployments that applied the CVE-2026-42358 fix should also upgrade to address this residual case. Upgrade to apache-airflow 3.3.1 or later.&#34;, &#34;reference_url&#34;: &#34;https://github.com/apache/airflow/pull/68422&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260816211121&#34;, &#34;collected_at&#34;: &#34;20260816211125&#34;, &#34;content_hash&#34;: &#34;e74b660c8f034dea8b8dd449ba02f8450ae7c315b2458b169236bee0ef1ac5aa&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-72685&#34;, &#34;sw_name&#34;: &#34;Elasticsearch&#34;, &#34;vendor&#34;: &#34;Elastic&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;MEDIUM&#34;, &#34;cvss_score&#34;: 4.3, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:N/A:L&#34;, &#34;published_date&#34;: &#34;20260813&#34;, &#34;modified_date&#34;: &#34;20260813&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] A flaw in Elasticsearch allows a low-privileged authenticated user who can index documents to submit a single small document containing a crafted user-supplied input. Processing one such document occupies a worker thread from a bounded pool for a disproportionate amount of time, degrading the availability of indexing operations on the affected node.&#34;, &#34;reference_url&#34;: &#34;https://discuss.elastic.co/t/elasticsearch-8-19-20-9-4-5-security-update-esa-2026-77/389500&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260815211214&#34;, &#34;collected_at&#34;: &#34;20260815211219&#34;, &#34;content_hash&#34;: &#34;1a80b0b0cf0c23f930ff7ed86d375149857d9f0ea016b5296b304d386ed272e8&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-14549&#34;, &#34;sw_name&#34;: &#34;Ray&#34;, &#34;vendor&#34;: &#34;Anyscale&#34;, &#34;affected_range&#34;: &#34;*&#34;, &#34;fixed_version&#34;: &#34;&#34;, &#34;severity&#34;: &#34;MEDIUM&#34;, &#34;cvss_score&#34;: 4.3, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:L/A:N&#34;, &#34;published_date&#34;: &#34;20260811&#34;, &#34;modified_date&#34;: &#34;20260812&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;[버전범위 불명확] The Ray Enterprise Translation WordPress plugin through 1.7.3 does not perform any capability or nonce checks on one of its AJAX actions, allowing any authenticated user, including Subscribers, to add or delete the site&#39;s configured languages.&#34;, &#34;reference_url&#34;: &#34;https://wpscan.com/vulnerability/3dd9bf3b-7fe4-4a58-ad05-1fc0bfb85413/&#34;, &#34;source&#34;: &#34;NVD&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260814211606&#34;, &#34;collected_at&#34;: &#34;20260814211613&#34;, &#34;content_hash&#34;: &#34;406a93a7314b85dc175b645c5c8ff78125526b55e0bcfab2c83d23712b5c39de&#34;}, {&#34;cve_id&#34;: &#34;CVE-2025-1194&#34;, &#34;sw_name&#34;: &#34;Transformers&#34;, &#34;vendor&#34;: &#34;Hugging Face&#34;, &#34;affected_range&#34;: &#34;&lt;4.50.0&#34;, &#34;fixed_version&#34;: &#34;4.50.0&#34;, &#34;severity&#34;: &#34;MEDIUM&#34;, &#34;cvss_score&#34;: 4.3, &#34;cvss_vector&#34;: &#34;CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:N/I:N/A:L&#34;, &#34;published_date&#34;: &#34;20250429&#34;, &#34;modified_date&#34;: &#34;20260813&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;A Regular Expression Denial of Service (ReDoS) vulnerability was identified in the huggingface/transformers library, specifically in the file `tokenization_gpt_neox_japanese.py` of the GPT-NeoX-Japanese model. The vulnerability occurs in the SubWordJapaneseTokenizer class, where regular expressions process specially crafted inputs. The issue stems from a regex exhibiting exponential complexity under certain conditions, leading to excessive backtracking. This can result in high CPU usage and potential application downtime, effectively creating a Denial of Service (DoS) scenario. The affected version is v4.48.1 (latest).&#34;, &#34;reference_url&#34;: &#34;https://nvd.nist.gov/vuln/detail/CVE-2025-1194&#34;, &#34;source&#34;: &#34;OSV&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260815211214&#34;, &#34;collected_at&#34;: &#34;20260815211215&#34;, &#34;content_hash&#34;: &#34;04c432fabf9a1348706544d2750500420c18c0f3c912b9d25bdf568c94be86db&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-59222&#34;, &#34;sw_name&#34;: &#34;Open WebUI&#34;, &#34;vendor&#34;: &#34;Open WebUI&#34;, &#34;affected_range&#34;: &#34;&gt;=0.7.0,&lt;0.10.0&#34;, &#34;fixed_version&#34;: &#34;0.10.0&#34;, &#34;severity&#34;: &#34;MEDIUM&#34;, &#34;cvss_score&#34;: null, &#34;cvss_vector&#34;: &#34;&#34;, &#34;published_date&#34;: &#34;20260724&#34;, &#34;modified_date&#34;: &#34;20260813&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;Open WebUI: /api/v1/channels/{id}/members exposes full user model including sensitive credentials ### Summary The channel members endpoint serializes and returns **full user models** for channel participants, including settings objects. A normal user in a DM can retrieve admin-only sensitive configuration such as webhook URLs and tool server key material (`settings.ui.toolServers[].key`), which is not available via standard user info APIs. ### Details The endpoint GET `/api/v1/channels/{id}/members` returns the full serialized user model for every member in the channel. In both the DM and non-DM code paths, the handler constructs the response with `[UserModelResponse(**user.model_dump(), is_active=...)]` and returns it as the users list. Because `UserModel` (`models/users.py`) includes a settings object (`UserSettings`) and arbitrary UI configuration (`settings.ui`), the endpoint exposes other users&#39; sensitive configuration to any channel participant. Practically, a regular user who pa&#34;, &#34;reference_url&#34;: &#34;https://github.com/advisories/GHSA-gh7p-78x6-jw6m&#34;, &#34;source&#34;: &#34;GHSA&#34;, &#34;ecosystem&#34;: &#34;pypi&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260815211214&#34;, &#34;collected_at&#34;: &#34;20260815211306&#34;, &#34;content_hash&#34;: &#34;94dee714f0970ae10c8350454c4cda6b61aea65f0f728504143224cae7d4ccc9&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-72764&#34;, &#34;sw_name&#34;: &#34;n8n&#34;, &#34;vendor&#34;: &#34;n8n GmbH&#34;, &#34;affected_range&#34;: &#34;&lt;1.123.67|&gt;=2.32.0,&lt;2.32.1|&gt;=2.0.0-rc.0,&lt;2.31.5&#34;, &#34;fixed_version&#34;: &#34;1.123.67&#34;, &#34;severity&#34;: &#34;MEDIUM&#34;, &#34;cvss_score&#34;: null, &#34;cvss_vector&#34;: &#34;CVSS:4.0/AV:N/AC:L/AT:P/PR:L/UI:N/VC:N/VI:N/VA:N/SC:H/SI:H/SA:H&#34;, &#34;published_date&#34;: &#34;20260722&#34;, &#34;modified_date&#34;: &#34;20260812&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;## Impact n8n&#39;s JavaScript task runner shared one module cache across all users&#39; Code-node executions, so a user able to run a Code node could poison a cached module and alter other users&#39; Code-node executions on the same runner, affecting their confidentiality, integrity, or availability. This is a cross-user isolation break within a single n8n instance. It does not constitute a sandbox escape or remote code execution. All multi-user n8n instances running the JS task runner with built-in or external modules enabled are affected. ## Patches The issue has been fixed in n8n versions 1.123.67, 2.31.5, and 2.32.1. Users should upgrade to one of these versions or later to remediate the vulnerability. ## Workarounds If upgrading is not immediately possible, administrators should consider the following temporary mitigations: - Restrict n8n instance access to fully trusted users only. - Disable built-in and external module access in Code nodes by unsetting `NODE_FUNCTION_ALLOW_BUILTIN` and `NO&#34;, &#34;reference_url&#34;: &#34;https://github.com/n8n-io/n8n/security/advisories/GHSA-9cmh-xcqm-5hqr&#34;, &#34;source&#34;: &#34;OSV&#34;, &#34;ecosystem&#34;: &#34;npm&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260814211606&#34;, &#34;collected_at&#34;: &#34;20260814211606&#34;, &#34;content_hash&#34;: &#34;7060e365ae603fb1ff90b36552890b96b78784f9bc292e21995160841584864b&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-72768&#34;, &#34;sw_name&#34;: &#34;n8n&#34;, &#34;vendor&#34;: &#34;n8n GmbH&#34;, &#34;affected_range&#34;: &#34;&gt;=2.32.0,&lt;2.32.1|&lt;2.31.5&#34;, &#34;fixed_version&#34;: &#34;2.32.1&#34;, &#34;severity&#34;: &#34;MEDIUM&#34;, &#34;cvss_score&#34;: null, &#34;cvss_vector&#34;: &#34;CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:L/VI:N/VA:N/SC:H/SI:H/SA:L&#34;, &#34;published_date&#34;: &#34;20260722&#34;, &#34;modified_date&#34;: &#34;20260812&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;## Impact On an n8n instance with SSRF protection enabled, the MCP Client node sent requests to a user-supplied endpoint without routing them through that protection and without pinning the resolved address. An authenticated user who could create or edit a workflow could therefore cause the server to connect to internal or otherwise blocked hosts and read the responses back through the workflow, exposing internal services the SSRF protection was meant to protect. ## Patches The issue has been fixed in n8n versions 2.31.5 and 2.32.1. Users should upgrade to one of these versions or later to remediate the vulnerability. ## Workarounds If upgrading is not immediately possible, administrators should consider the following temporary mitigations: - Restrict n8n instance access to fully trusted users only. - Disable the MCP Client node by adding it to the `NODES_EXCLUDE` environment variable. - Restrict network egress from the n8n host to block access to internal and link-local address ranges&#34;, &#34;reference_url&#34;: &#34;https://github.com/n8n-io/n8n/security/advisories/GHSA-vhf8-cg2h-cg3p&#34;, &#34;source&#34;: &#34;OSV&#34;, &#34;ecosystem&#34;: &#34;npm&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260814211606&#34;, &#34;collected_at&#34;: &#34;20260814211606&#34;, &#34;content_hash&#34;: &#34;519ec880bfb9365ea5964014a781b570c86813cef1a9843519cb04d8f5eaccde&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-72769&#34;, &#34;sw_name&#34;: &#34;n8n&#34;, &#34;vendor&#34;: &#34;n8n GmbH&#34;, &#34;affected_range&#34;: &#34;&lt;1.123.67|&gt;=2.32.0,&lt;2.32.1|&gt;=2.0.0-rc.0,&lt;2.31.5&#34;, &#34;fixed_version&#34;: &#34;1.123.67&#34;, &#34;severity&#34;: &#34;MEDIUM&#34;, &#34;cvss_score&#34;: null, &#34;cvss_vector&#34;: &#34;CVSS:4.0/AV:N/AC:L/AT:P/PR:L/UI:N/VC:N/VI:H/VA:H/SC:N/SI:N/SA:N&#34;, &#34;published_date&#34;: &#34;20260722&#34;, &#34;modified_date&#34;: &#34;20260812&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;## Impact An authenticated user able to create or edit a workflow expression could abuse the expression engine&#39;s array-element access to obtain a reference to a host built-in and pollute its prototype in the main n8n process, leading to a denial of service. Both self-hosted and cloud instances running the VM expression engine are affected. ## Patches The issue has been fixed in n8n versions 1.123.67, 2.31.5, and 2.32.1. Users should upgrade to one of these versions or later to remediate the vulnerability. ## Workarounds If upgrading is not immediately possible, administrators should consider the following temporary mitigations: - Restrict n8n instance access to fully trusted users only. - Disable the VM expression engine if an alternative is available for your deployment. These workarounds do not fully remediate the risk and should only be used as short-term mitigation measures.&#34;, &#34;reference_url&#34;: &#34;https://github.com/n8n-io/n8n/security/advisories/GHSA-hx4h-vr3m-45vh&#34;, &#34;source&#34;: &#34;OSV&#34;, &#34;ecosystem&#34;: &#34;npm&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260814211606&#34;, &#34;collected_at&#34;: &#34;20260814211606&#34;, &#34;content_hash&#34;: &#34;d711ca17efc1b6fee4fcc6fd2ec4adc58f65aab7c7cd62f790be291e35cf8d34&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-72773&#34;, &#34;sw_name&#34;: &#34;n8n&#34;, &#34;vendor&#34;: &#34;n8n GmbH&#34;, &#34;affected_range&#34;: &#34;&gt;=2.32.0,&lt;2.32.1|&lt;2.31.5&#34;, &#34;fixed_version&#34;: &#34;2.32.1&#34;, &#34;severity&#34;: &#34;MEDIUM&#34;, &#34;cvss_score&#34;: null, &#34;cvss_vector&#34;: &#34;CVSS:4.0/AV:N/AC:L/AT:P/PR:L/UI:N/VC:N/VI:N/VA:N/SC:H/SI:N/SA:N&#34;, &#34;published_date&#34;: &#34;20260722&#34;, &#34;modified_date&#34;: &#34;20260812&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;## Impact The component `@n8n/computer-use` file-search tool confined searches to a configured base directory. A crafted search pattern could bypass the confinement check and expand to locations outside that directory, causing the tool to return the names and contents of files anywhere the daemon&#39;s OS user could read. Any deployment where an actor could influence the tool&#39;s search input was affected; the result was disclosure of arbitrary local files outside the intended sandbox. ## Patches The issue has been fixed in n8n versions 2.31.5 and 2.32.1. Users should upgrade to one of these versions or later to remediate the vulnerability. ## Workarounds If upgrading is not immediately possible, administrators should consider the following temporary mitigations: - Restrict n8n instance access to fully trusted users only. - Disable or remove AI agent workflows that use the `computer-use` package until the instance is patched. - Ensure the n8n process runs under a dedicated low-privilege user&#34;, &#34;reference_url&#34;: &#34;https://github.com/n8n-io/n8n/security/advisories/GHSA-pf2q-pxhf-hgmw&#34;, &#34;source&#34;: &#34;OSV&#34;, &#34;ecosystem&#34;: &#34;npm&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260814211606&#34;, &#34;collected_at&#34;: &#34;20260814211606&#34;, &#34;content_hash&#34;: &#34;4947a6a363a5c22e2d7f40e3557e8c439b426f40305532c248e47b545f8f980b&#34;}, {&#34;cve_id&#34;: &#34;CVE-2026-72775&#34;, &#34;sw_name&#34;: &#34;n8n&#34;, &#34;vendor&#34;: &#34;n8n GmbH&#34;, &#34;affected_range&#34;: &#34;&lt;1.123.67|&gt;=2.32.0,&lt;2.32.1|&gt;=2.0.0-rc.0,&lt;2.31.5&#34;, &#34;fixed_version&#34;: &#34;1.123.67&#34;, &#34;severity&#34;: &#34;MEDIUM&#34;, &#34;cvss_score&#34;: null, &#34;cvss_vector&#34;: &#34;CVSS:4.0/AV:N/AC:L/AT:P/PR:L/UI:N/VC:N/VI:N/VA:N/SC:H/SI:H/SA:H&#34;, &#34;published_date&#34;: &#34;20260722&#34;, &#34;modified_date&#34;: &#34;20260812&#34;, &#34;kev_yn&#34;: &#34;N&#34;, &#34;summary&#34;: &#34;## Impact The Postgres Trigger node interpolated user-supplied identifier parameters (channel, function, and trigger names) into SQL statements without proper escaping, so an authenticated user could inject arbitrary SQL executed against the connected PostgreSQL database with the configured credential&#39;s privileges. Successful exploitation allows full read and write access to the connected PostgreSQL database. ## Patches The issue has been fixed in n8n versions 1.123.67, 2.31.5 and 2.32.1. Users should upgrade to these versions or later to remediate the vulnerability. ## Workarounds If upgrading is not immediately possible, administrators should consider the following temporary mitigations: - Restrict n8n instance access to fully trusted users only. - Disable the PostgresTrigger node by adding `n8n-nodes-base.postgresTrigger` to the `NODES_EXCLUDE` environment variable. - Ensure PostgreSQL credentials used with n8n are configured with the minimum required privileges and do not use SUPER&#34;, &#34;reference_url&#34;: &#34;https://github.com/n8n-io/n8n/security/advisories/GHSA-jqwr-vx3p-r266&#34;, &#34;source&#34;: &#34;OSV&#34;, &#34;ecosystem&#34;: &#34;npm&#34;, &#34;first_seen_run&#34;: &#34;20260814211606&#34;, &#34;last_seen_run&#34;: &#34;20260814211606&#34;, &#34;collected_at&#34;: &#34;20260814211606&#34;, &#34;content_hash&#34;: &#34;197a5be48d7cb5f9cd283488447b1a78fa57fe8d7bb522e0ae8bd68ded49d909&#34;}];
const tbody = document.querySelector('#tbl tbody');
const q = document.getElementById('q'), sev = document.getElementById('sev');
const sw = document.getElementById('sw'), kev = document.getElementById('kev');
const count = document.getElementById('count');

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function row(c) {
  const link = c.reference_url
    ? `<a href="${esc(c.reference_url)}" target="_blank" rel="noopener">${esc(c.cve_id)}</a>`
    : esc(c.cve_id);
  return `<tr>
    <td class="mono">${link}</td>
    <td>${esc(c.sw_name)}</td>
    <td class="sev sev-${esc(c.severity)}">${esc(c.severity)}</td>
    <td>${c.cvss_score == null ? '-' : esc(c.cvss_score)}</td>
    <td class="mono">${esc(c.affected_range)}</td>
    <td class="mono">${esc(c.fixed_version) || '-'}</td>
    <td>${c.kev_yn === 'Y' ? '<span class="kev">KEV</span>' : '-'}</td>
    <td class="mono">${esc(c.published_date)}</td>
    <td>${esc(c.source)}</td>
    <td class="wrap-cell">${esc(c.summary)}</td>
  </tr>`;
}

function render() {
  const term = q.value.trim().toLowerCase();
  const rows = DATA.filter(c =>
    (!sev.value || c.severity === sev.value) &&
    (!sw.value || c.sw_name === sw.value) &&
    (!kev.value || (c.kev_yn || 'N') === kev.value) &&
    (!term ||
      (c.cve_id || '').toLowerCase().includes(term) ||
      (c.sw_name || '').toLowerCase().includes(term) ||
      (c.summary || '').toLowerCase().includes(term))
  );
  tbody.innerHTML = rows.length
    ? rows.map(row).join('')
    : '<tr><td colspan="10" class="empty">조건에 맞는 CVE 가 없습니다.</td></tr>';
  count.textContent = `${rows.length} / ${DATA.length} 건 표시`;
}

[q, sev, sw, kev].forEach(el => el.addEventListener('input', render));
document.getElementById('reset').addEventListener('click', () => {
  q.value = ''; sev.value = ''; sw.value = ''; kev.value = ''; render();
});
render();
</script>
</body>
</html>
