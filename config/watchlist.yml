# ============================================================
#  감시 대상 AI 오픈소스 목록
# ============================================================
#  canonical_name : ★ 내부망 TB_SW.SW_NM 과 1:1로 일치해야 하는 최종 제품명.
#                     엑셀 SW_NAME 컬럼에 이 값이 그대로 들어간다.
#                     내부망 목록과 철자가 다르면 매칭이 안 되니 반드시 맞출 것.
#  aliases        : 소스가 돌려주는 원본 패키지명들 (매칭·중복제거용, 소문자 비교)
#  ecosystem      : pypi / npm / github / other   (엑셀 ECOSYSTEM 컬럼 값)
#  pypi/npm/go    : OSV 조회용 패키지 좌표 (없으면 생략)
#  github         : owner/repo  (GHSA·참고 URL용)
#  cpe_keyword    : NVD keywordSearch 검색어
#  vendor         : 엑셀 VENDOR 컬럼 기본값
#  group          : framework/serving/library/app/ui/vectordb/mlops/base
#  enabled        : false면 수집 대상에서 완전 제외
#  in_use         : 내부망에 실제 반입된 S/W인지 (--only-in-use 로 범위 축소)
# ============================================================

